name: Verify v241 four OBgE image URLs
on:
  push:
    branches: [main]
    paths:
      - 'evidence/v241-obge-4.json'
      - 'scripts/verify_v241_obge_4.py'
      - '.github/workflows/verify-v241-obge-4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - run: python scripts/verify_v241_obge_4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v241-obge-4-public-url-report
          path: v241-obge-public-check.json
          if-no-files-found: warn
