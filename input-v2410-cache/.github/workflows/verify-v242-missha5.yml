name: Verify MISSHA 5X 130ml public images
on:
  push:
    branches: [main]
    paths:
      - 'evidence/v242-missha5.json'
      - 'scripts/verify_v242_missha5.py'
      - '.github/workflows/verify-v242-missha5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/verify_v242_missha5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v242-missha5-url-verification
          path: v242-missha5-public-verification.json
          if-no-files-found: warn
