name: Shopee eight-family multi-view real photo capture v249
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_eight_multiview_v249.py'
      - '.github/workflows/collect-eight-multiview-v249.yml'
permissions:
  contents: read
jobs:
  source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source browser
        run: |
          python -m pip install requests Pillow playwright
          python -m playwright install chromium --with-deps
      - name: Capture actual additional photo bytes for eight families
        run: python scripts/collect_eight_multiview_v249.py
      - name: Preserve all captured source evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-eight-multiview-source-evidence-v249
          path: multi-view-evidence-v249/
          if-no-files-found: warn
