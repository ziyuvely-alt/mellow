name: Produce authentic BBIA photo-only thumbnail drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_bbia_thumbnail_review.py'
      - 'evidence/bbia-image-review-input.json'
      - '.github/workflows/build-bbia-thumbnail-drafts.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Add Korean typefaces and Pillow image processor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install Pillow
      - name: Render ALL source-photo-based review drafts
        run: python3 scripts/render_bbia_thumbnail_review.py
      - name: Archive ALL candidate graphics and exact hash manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbia-full-product-graphics-for-qa-not-release
          path: bbia-image-review-previews/
          compression-level: 6
          if-no-files-found: warn