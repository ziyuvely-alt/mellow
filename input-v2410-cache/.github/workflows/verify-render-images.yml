name: Verify live Shopee image URLs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'public/asset-manifest.json'
      - 'scripts/verify_render_assets.py'
      - '.github/workflows/verify-render-images.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify all public image URLs, signatures, byte sizes and SHA256
        run: python3 scripts/verify_render_assets.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-image-url-validation
          path: render-url-verification.json
          if-no-files-found: warn
