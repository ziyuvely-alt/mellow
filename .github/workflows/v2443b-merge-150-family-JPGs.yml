name: Shopee v2443b thirty families 150 actual candidate JPG full byte-checked archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2443b-merge-150-family-JPGs.yml'
      - 'scripts/v2443b_merge_all_30group_150_original_JPGs.py'
permissions:
  contents: write
jobs:
  join-actual-image-sets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover prior 29+1 exact JPG sets and approved factual 145mL copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir prior-v2442b prior-v2443
          git fetch origin production-assets-v2442b-thirty-safety-filtered-sets production-assets-v2443-pixelpure-five-145ml
          git archive origin/production-assets-v2442b-thirty-safety-filtered-sets | tar -xf - -C prior-v2442b
          git archive origin/production-assets-v2443-pixelpure-five-145ml | tar -xf - -C prior-v2443
      - name: Merge 150 byte-for-byte JPGs with no old image rendering
        run: python scripts/v2443b_merge_all_30group_150_original_JPGs.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2443b-30-family-150-real-review-candidate-JPGs
          path: v2443b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve only new branch and ZIP, no prior main public image changes
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2443b-output /tmp/v2443b-final
          git worktree add --detach /tmp/v2443b-wt HEAD
          cd /tmp/v2443b-wt
          git switch --orphan production-assets-v2443b-30family-150-JPG-review
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2443b-final/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive 150 immutable candidate JPGs for 30 product families pending exact sale-rights QA'
          git push origin HEAD:refs/heads/production-assets-v2443b-30family-150-JPG-review
