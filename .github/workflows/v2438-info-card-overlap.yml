name: Shopee v2438 two actual info-card overlap repairs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2438-info-card-overlap.yml'
      - 'scripts/v2438_repair_two_card_ornaments.py'
permissions:
  contents: write
jobs:
  correct-actual-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover immutable existing source JPG
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Perform two exact visual panel repairs
        run: python scripts/v2438_repair_two_card_ornaments.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2438-two-info-card-actual-JPG-repairs
          path: v2438-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve non-published sales drafts without overwriting
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2438-output /tmp/v2438-output
          git worktree add --detach /tmp/v2438-wt HEAD
          cd /tmp/v2438-wt
          git switch --orphan production-assets-v2438-two-card-layout-fixes
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2438-output/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve two corrected legible information-card JPGs pending source and rights QA'
          git push origin HEAD:refs/heads/production-assets-v2438-two-card-layout-fixes
