name: Shopee v2667 select five distinct actual product scenes once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2667-five-actual-scene-selection.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  select-real-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Get historical real source JPG files once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41764831639 -n shopee-v2593-definitive-156-physical-JPG-17delta-review-corpus-no-XLSX -D source/historical
      - name: Preserve only 5 selected original photo scenes and large review proof
        run: python scripts/v2667_five_actual_scene_selection.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2667-five-actual-original-photos-and-visual-proof-QA-no-XLSX
          path: v2667-five-actual-original-photo-select/
          retention-days: 90
          if-no-files-found: error
