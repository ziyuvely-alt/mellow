name: Shopee v2806 CLIO Mesh Glow select visual B cutout plus four original scenes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2806-clio-meshglow-photo-first-alpha-b-choice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Select only previously saved B real-alpha source and preserve four gallery sources
        run: |
          cp scripts/v2806_clio_meshglow_select_real_alpha_b.py /tmp/v2806.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2806-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2806-qa
          python /tmp/v2806.py
          git add qa-review/v2806-clio-meshglow-b-foreground-four-distinct-real-photo-qa
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2806 choose visually reviewed CLIO B alpha and preserve 4 official original scenes, QA only'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
