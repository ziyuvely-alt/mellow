name: Shopee v2860 CLIO MeshBlur 3 verified shade true alpha QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2860-clio-meshblur-three-source-shade-truealpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  three_shades_alpha_only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless
      - name: Compose source-identity-verified QA for 19C 19N 21N without touching sales images
        run: |
          cp scripts/v2860_clio_meshblur_3shade_truealpha_qa.py /tmp/v2860.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2860qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2860qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2860.py
          git add qa-review/v2860-clio-meshblur-three-truealpha-source-variants-QA
          git commit -m 'v2860 archive CLIO Mesh Blur original RGB true alpha masks and 1080 shade QA'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
