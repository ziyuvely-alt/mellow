name: Shopee v2552 Goodal pending21 distinct real-photo slot05 QA candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2552_goodal_21_slot05_real_photo_candidate.py'
      - '.github/workflows/v2552-goodal-eye-photo-proposal.yml'
permissions:
  actions: read
  contents: read
jobs:
  goodal-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse 156 prior original images, never regenerate or overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41715911900 -n shopee-v2548-156-JPG-Pixelpure-Aura-Serum-2real-scenes-QA -D v2552-baseline
      - name: Reuse previously staged original Goodal 25AD source photography
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41693239543 -n shopee-v2504-goodal-25ad-30ml-eye-cream-real-source-QA -D v2552-goodal-real-source
      - name: Produce only a staged genuine-photo candidate or quarantine missing source
        run: python scripts/v2552_goodal_21_slot05_real_photo_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2552-goodal-21-slot05-distinct-real-photo-QA-no-XLSX
          path: v2552-goodal-slot05-candidate-review/
          retention-days: 90
          if-no-files-found: error
