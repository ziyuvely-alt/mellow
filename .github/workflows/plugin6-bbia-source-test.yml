name: Plugin 6 BBIA source ingest - isolated test
on:
  push:
    branches: [plugin6-zip-engine-v041]
    paths:
      - 'plugin6/**'
      - '.github/workflows/plugin6-bbia-source-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup
        run: python -m pip install Pillow==11.3.0
      - name: Recover real BBIA source candidates
        run: python plugin6/ingest_48.py
      - name: Upload checked source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin6-bbia48-source-candidates-not-sale-ready
          path: plugin6/out/
          retention-days: 14
