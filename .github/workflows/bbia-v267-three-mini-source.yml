name: BBIA v267 three mini original identity proof
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v267_three_mini_source_gate.py, .github/workflows/bbia-v267-three-mini-source.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v267_three_mini_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v267-mini-product-source-contact
          path: /tmp/bbia-v267
          retention-days: 30
