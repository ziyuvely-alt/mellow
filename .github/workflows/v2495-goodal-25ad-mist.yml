name: Shopee v2495 Goodal 25AD serum mist exact source QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2495-goodal-25ad-mist.yml'
      - 'scripts/v2495_goodal_25ad_mist_exact_source.py'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/v2495_goodal_25ad_mist_exact_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2495-goodal-25ad-mist-original-image-QA-HOLD
          path: v2495-goodal-mist-25ad-exact/
          retention-days: 90
          if-no-files-found: error
