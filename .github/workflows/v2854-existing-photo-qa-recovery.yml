name: Shopee v2854 recover MISSHA serum30 and OBgE suncream300 immutable QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2854-existing-photo-qa-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Copy and verify ten already saved JPGs without additional segmentation
        run: |
          cp scripts/v2854_missha30_obge300_reuse_old_photoQA.py /tmp/v2854.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2854qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2854qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2854.py
          git add qa-review/v2854-missha30-obge300-recovered-existing-artwork-QA
          git commit -m 'v2854 preserve ten existing photo JPGs and mark defective old variants as QA holds'
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
