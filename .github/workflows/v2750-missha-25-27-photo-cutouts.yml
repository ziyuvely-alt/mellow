name: Shopee v2750 two authentic separate MISSHA N25 and N27 photo cutouts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2750-missha-25-27-photo-cutouts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  masks:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual image segmentation and contour tools
        run: python -m pip install Pillow numpy opencv-python-headless 'rembg[cpu]==2.0.67'
      - name: Create original source N25/N27 alpha masks, never repurpose 21/23 photo
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2750_two_independent_missha_shade_cutouts.py /tmp/v2750.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2750-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2750-qa
          python /tmp/v2750.py
          git add qa-review/v2750-missha-N25-N27-distinct-official-photo-cutout-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2750 distinct official shade25/27 true transparent source cutouts, no false swatches'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
