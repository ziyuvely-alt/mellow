name: Shopee v2749 MISSHA N25 and N27 actual variant-specific product-photo evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2749-missha-coverlasting-25-27-source-identity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - name: Query original brand operated variant IDs and download only linked N25/N27 original photos
        run: |
          python -m py_compile scripts/v2749_missha_N25_N27_independent_photo_source.py
          python scripts/v2749_missha_N25_N27_independent_photo_source.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2749-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2749-qa/qa-review/v2749-MISSHA-coverlasting-N25-N27-official-variant-source-proof
          cp -a qa-review/v2749-MISSHA-coverlasting-N25-N27-official-variant-source-proof /tmp/v2749-qa/qa-review/
          cd /tmp/v2749-qa
          git add qa-review/v2749-MISSHA-coverlasting-N25-N27-official-variant-source-proof
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2749 capture explicit N25/N27 official-variant image IDs or quarantine source gap, no fake shades'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
