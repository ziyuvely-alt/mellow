name: Shopee v2429 C6 photo QA and 30-family resumable batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2429-c6-multifamily.yml'
      - 'scripts/v2429_c6_multifamily_batch.py'
permissions:
  contents: write
jobs:
  c6-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore exact immutable 2.4.27b and 2.4.28 evidence
        run: |
          mkdir v2427b-source v2428-source
          git fetch origin production-assets-v2427b-obge-shade-clean production-assets-v2428-multifamily-qa
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C v2427b-source
          git archive origin/production-assets-v2428-multifamily-qa | tar -xf - -C v2428-source
      - name: Run six independent family batches and recover real 30-family queue
        run: python scripts/v2429_c6_multifamily_batch.py
      - name: Upload real QA JPGs and complete checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2429-C6-multi-family-QA-and-queue
          path: v2429-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve QA branch without changing public images
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2429-output /tmp/v2429-qa
          git worktree add --detach /tmp/v2429-wt HEAD
          cd /tmp/v2429-wt
          git switch --orphan production-assets-v2429-C6-family-batch
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2429-qa/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve six C-family authentic-source QA JPGs and resumable checkpoints'
          git push origin HEAD:refs/heads/production-assets-v2429-C6-family-batch
