name: BBIA v217 refill-only candidate from official source
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v217_refill_candidate.py
      - .github/workflows/bbia-v217-refill-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Produce one authentic refill-only English scene candidate
        run: python scripts/bbia_v217_refill_candidate.py --out /tmp/bbia-v217
      - name: Archive independent QA_PENDING image and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbia-v217-official-refill-only-qa-pending
          path: /tmp/bbia-v217
          retention-days: 30
          if-no-files-found: warn
