name: Shopee v2437b three further source-photo JPG revisions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2437b-three-more-photo-revisions.yml'
      - 'scripts/v2437b_three_more_photo_revisions.py'
permissions:
  contents: write
jobs:
  three-more-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore immutable source photos
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Render three source-photo customer draft revisions
        run: python scripts/v2437b_three_more_photo_revisions.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2437b-three-further-real-photo-customer-JPGs
          path: v2437b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Store separate immutable candidate branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2437b-output /tmp/v2437b-save
          git worktree add --detach /tmp/v2437b-wt HEAD
          cd /tmp/v2437b-wt
          git switch --orphan production-assets-v2437b-three-more-photo-revisions
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2437b-save/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save three additional real-photo customer JPG revisions pending rights approval'
          git push origin HEAD:refs/heads/production-assets-v2437b-three-more-photo-revisions
