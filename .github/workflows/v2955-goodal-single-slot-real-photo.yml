name: Shopee v2955 correct Goodal mist third QA photo only
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2955-goodal-single-slot-real-photo.yml'
      - 'scripts/v2955_goodal_mist_replace_info_card_with_real_photo_QA.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-info-with-real-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Stage one genuine existing third photo without rewriting any older zip
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2955-goodal-mist-third-slot-real-photo-correction-20261106
          python scripts/v2955_goodal_mist_replace_info_card_with_real_photo_QA.py
          git add qa-review/v2955-goodal-mist-third-slot-real-photo-correction-20261106
          git diff --cached --name-only | tee /tmp/v2955-only-new-path
          ! grep -Ev '^qa-review/v2955-goodal-mist-third-slot-real-photo-correction-20261106/' /tmp/v2955-only-new-path
          git commit -m "QA v2955: Goodal mist five actual source photo scenes with third info card corrected"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
