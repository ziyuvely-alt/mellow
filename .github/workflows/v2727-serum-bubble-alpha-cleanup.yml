name: Shopee v2727 targeted MISSHA serum decorative alpha debris removal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2727-serum-bubble-alpha-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retouch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Remove only stray upper alpha decorations from existing v2726 genuine product, no new segmentation model
        run: |
          cp scripts/v2727_cleanup_serum_alpha_bubble_remnants.py /tmp/v2727.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2727-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2727-qa
          python /tmp/v2727.py
          git add qa-review/v2727-missha-serum-only-bubble-alpha-cleanup-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2727 remove only verified right floating source bubble alpha from real 30ml serum hero, QA only'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
