name: Shopee v2420 Korean INFO frames to English master
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2420-en-production.yml'
      - 'scripts/v2420_en_master_revise.py'
      - 'evidence/v2420-en-frame-content.tsv'
permissions:
  contents: write
  actions: read
jobs:
  en-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow, fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python -m pip install Pillow
      - name: Restore all 160 saved JPG source photos and information frames
        run: |
          mkdir -p input-v2416c input-v2420-public
          git fetch origin production-assets-v2416c production-assets-v2420-public-language-audit
          git archive origin/production-assets-v2416c | tar -xf - -C input-v2416c
          git archive origin/production-assets-v2420-public-language-audit | tar -xf - -C input-v2420-public
      - name: Recreate only embedded Korean information panels as EN master
        run: python scripts/v2420_en_master_revise.py
      - name: Archive EN replacement JPG, original 215 images, diffs and 30 family ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2420-64-en-master-revisions
          path: production-v2420-en-master/
          retention-days: 90
          if-no-files-found: warn
      - name: Save versioned EN production without modifying public originals
        if: success()
        run: |
          cp -a production-v2420-en-master /tmp/v2420-en-master
          git worktree add --detach /tmp/v2420-en-wt HEAD
          cd /tmp/v2420-en-wt
          git switch --orphan production-assets-v2420-en-master
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2420-en-master/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve v2420 64 English information frame versions and immutable 55 public originals"
          git push origin HEAD:refs/heads/production-assets-v2420-en-master
