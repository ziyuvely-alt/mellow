name: Shopee v2734 distinct-source U2Net recovery for 2 failed products
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2734-two-actual-product-photo-alternative-model.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  segmented:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy 'rembg[cpu]==2.0.67'
      - name: Precision tube ROI and different compact photograph via U2Net, no older assets mutated
        env:
          U2NET_HOME: /tmp/u2net-originals
        run: |
          python -m py_compile scripts/v2734_two_distinct_source_u2net_stock_cutouts.py
          cp scripts/v2734_two_distinct_source_u2net_stock_cutouts.py /tmp/v2734.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2734-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2734-qa
          test ! -e qa-review/v2734-two-failed-families-different-photo-ROI-u2net
          python /tmp/v2734.py
          git add qa-review/v2734-two-failed-families-different-photo-ROI-u2net
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2734 alternative original photos plus U2Net for two failed stock images, no retail release'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
