name: Shopee v2449 five new photographed detail JPG drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2449-five-details.yml'
      - 'scripts/v2449_five_distinct_photo_details.py'
permissions:
  contents: write
jobs:
  actual-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore real source images and checksum manifest
        run: |
          mkdir prior-v2445b
          git fetch origin production-assets-v2445b-corrected-QA-hold-146
          git archive origin/production-assets-v2445b-corrected-QA-hold-146 | tar -xf - -C prior-v2445b
      - name: Produce five source photo details
        run: python scripts/v2449_five_distinct_photo_details.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2449-five-new-photo-detail-candidates
          path: v2449-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve isolated branch without public URL change
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2449-output /tmp/v2449-drafts
          git worktree add --detach /tmp/v2449-wt HEAD
          cd /tmp/v2449-wt
          git switch --orphan production-assets-v2449-five-new-photo-details
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2449-drafts/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve five new original photo-based customer drafts, pending rights approval'
          git push origin HEAD:refs/heads/production-assets-v2449-five-new-photo-details
