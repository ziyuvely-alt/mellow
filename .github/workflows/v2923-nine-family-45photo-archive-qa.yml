name: Shopee v2923 9 pending family 45 existing JPG source ZIP contact review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2923-nine-family-45photo-archive-qa.yml'
      - 'scripts/v2923_nine_pending_family_45_immutable_photos_contact_ZIPs.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive_nine_preexisting_five_photo_sets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Group 45 pre-existing original JPG sources into 9 internal-only ZIPs and contacts
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2923_nine_pending_family_45_immutable_photos_contact_ZIPs.py
          cp scripts/v2923_nine_pending_family_45_immutable_photos_contact_ZIPs.py /tmp/v2923.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2923qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2923qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2923-nine-other-pending-family-45archived-source-photo-zip-and-contact-QA
          python /tmp/v2923.py
          git add qa-review/v2923-nine-other-pending-family-45archived-source-photo-zip-and-contact-QA
          git diff --cached --name-only | tee /tmp/v2923-changed
          ! grep -Ev '^qa-review/v2923-nine-other-pending-family-45archived-source-photo-zip-and-contact-QA/' /tmp/v2923-changed
          git commit -m 'v2923 archive 45 untouched existing JPGs for 9 pending stock item QA-only ZIPs and visual contacts'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
