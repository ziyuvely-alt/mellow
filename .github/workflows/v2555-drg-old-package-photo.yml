name: Shopee v2555 DrG old 70ml cream staged real packaging scene QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2555_drg_old_package_slot04_candidate.py'
      - '.github/workflows/v2555-drg-old-package-photo.yml'
permissions:
  actions: read
  contents: read
jobs:
  source-backed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore immutable 156-JPG QA corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41715911900 -n shopee-v2548-156-JPG-Pixelpure-Aura-Serum-2real-scenes-QA -D v2555-base156
      - name: Restore verified older DrG jar-carton photo bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41692792277 -n shopee-v2502-drg-2022-clear-soothing-70ml-old-photo-QA -D v2555-source-old
      - name: Build or quarantine one new old-package scene candidate
        run: python scripts/v2555_drg_old_package_slot04_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2555-DrG-pending16-old-70ml-package-photo-QA-no-XLSX
          path: v2555-pending16-old-pack-photo-review/
          retention-days: 90
          if-no-files-found: error
