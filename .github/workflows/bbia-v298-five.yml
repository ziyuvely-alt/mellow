name: BBIA v298 five untouched cushion sources
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v298_five_sources.py, .github/workflows/bbia-v298-five.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v298_five_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v298-five-unused-cushion-pact-photo-sources
          path: /tmp/bbia-v298
          retention-days: 30
