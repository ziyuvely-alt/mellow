name: Shopee v2500 CLIO mini exact two targeted wording corrections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2500-clio-mini-targeted-wording.yml'
      - 'scripts/v2500_clio_mini_two_targeted_wording_fixes.py'
permissions:
  actions: read
  contents: write
jobs:
  fix-only-two:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore preexisting two JPGs, without regenerating product work
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41691203770 -n shopee-v2499-clio-mini-2-non-swatch-factual-JPG-QA-HOLD -D v2499-source
      - name: Fix only unsupported tone descriptors and two footers
        run: python scripts/v2500_clio_mini_two_targeted_wording_fixes.py
      - name: Actual two files must exist
        run: |
          test -s v2500-clio-mini-targeted-corrections/04-mini-3-shade-names-corrected.jpg
          test -s v2500-clio-mini-targeted-corrections/05-mini-puff-directions-footer-corrected.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2500-clio-mini-two-targeted-fixes-no-XLSX
          path: v2500-clio-mini-targeted-corrections/
          retention-days: 90
          if-no-files-found: error
      - name: Save isolated review branch, preserve previous originals
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2500-clio-mini-targeted-corrections /tmp/v2500-output
          git worktree add --detach /tmp/v2500-wt HEAD
          cd /tmp/v2500-wt
          git switch --orphan production-assets-v2500-clio-mini-targeted
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2500-output/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve two CLIO mini wording-only JPG fixes for final logo and shade QA'
          git push origin HEAD:refs/heads/production-assets-v2500-clio-mini-targeted
