name: Produce CLIO Original Mini 5g source-photo images and probe Render
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/produce-clio-mini-v245.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Create actual CLIO product image layouts
        run: |
          python - <<'PY'
          import io,json,hashlib,urllib.request,zipfile
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          source='https://www.toktokbeauty.com/cdn/shop/files/8809970759770_0.png?v=1743131689&width=1200'
          req=urllib.request.Request(source,headers={'User-Agent':'Mozilla/5.0 (MellowKR-Product-Photo-Editor/1.0)'})
          with urllib.request.urlopen(req,timeout=50) as r:data=r.read(5000000)
          product=Image.open(io.BytesIO(data));product.load()
          assert product.width>=500 and product.height>=500 and product.format in ('PNG','JPEG')
          source_rgb=product.convert('RGB')
          # Reuse actual MellowKR logo cropped from earlier completed product image without redrawing it.
          logo_origin=Image.open('public/images/lamelin-miracle-nmn-pdrn-biotox-cream-50ml-sourcephoto-v243-20261101/01.jpg').convert('RGB')
          logo=logo_origin.crop((908,907,1065,1065)).convert('RGBA')
          mask=Image.new('L',logo.size,0);ImageDraw.Draw(mask).ellipse((2,2,logo.width-3,logo.height-3),fill=255)
          logo.putalpha(mask)
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          F=lambda n,b=False:ImageFont.truetype(bold if b else reg,n)
          def paste_photo(im,rect):
            x,y,w,h=rect
            p=source_rgb.copy();p.thumbnail((w,h),Image.Resampling.LANCZOS)
            im.paste(p,(x+(w-p.width)//2,y+(h-p.height)//2))
          def mk(im):im.paste(logo,(898,907),logo)
          pages=[]
          # Entire product photo remains unaltered, preserving shade and its real package.
          im=Image.new('RGB',(1080,1080),'#F6F3F0');d=ImageDraw.Draw(im)
          d.text((65,65),'CLIO',font=F(74,True),fill='#363A3D')
          d.text((70,154),'KILL COVER FOUNWEAR CUSHION',font=F(28),fill='#404348')
          d.text((70,193),'THE ORIGINAL MINI',font=F(27,True),fill='#404348')
          paste_photo(im,(35,238,1000,675));mk(im);pages.append(im)
          im=Image.new('RGB',(1080,1080),'#FFFFFF');d=ImageDraw.Draw(im)
          d.rectangle((0,0,1080,194),fill='#E6DDD6')
          d.text((65,54),'THE ORIGINAL MINI',font=F(52,True),fill='#303139')
          d.text((65,123),'Portable mini cushion',font=F(28),fill='#47474C')
          paste_photo(im,(90,220,900,680));mk(im);pages.append(im)
          im=Image.new('RGB',(1080,1080),'#F3F0F0');d=ImageDraw.Draw(im)
          d.rectangle((0,0,1080,155),fill='#363538')
          d.text((65,48),'CLIO  |  MINI SIZE',font=F(44,True),fill='#FFFFFF')
          paste_photo(im,(70,192,945,725))
          mk(im);pages.append(im)
          im=Image.new('RGB',(1080,1080),'#FFFFFF');d=ImageDraw.Draw(im)
          d.text((70,61),'COMPACT CUSHION',font=F(49,True),fill='#353637')
          paste_photo(im,(75,182,930,660))
          d.rounded_rectangle((72,862,890,948),radius=20,fill='#EDE4DB')
          d.text((100,880),'The Original Mini',font=F(31),fill='#3E4141')
          mk(im);pages.append(im)
          im=Image.new('RGB',(1080,1080),'#F6F2ED');d=ImageDraw.Draw(im)
          d.text((68,55),'CLIO',font=F(73,True),fill='#33343B')
          paste_photo(im,(70,203,930,685))
          d.text((70,907),'KILL COVER  /  MINI',font=F(30,True),fill='#34353A')
          mk(im);pages.append(im)
          root=Path('public/images/clio-kill-cover-founwear-cushion-original-mini-sourcephoto-v245-20261101');root.mkdir(parents=True,exist_ok=True)
          report=[]
          for i,im in enumerate(pages,1):
            file=root/f'{i:02}.jpg';im.save(file,format='JPEG',quality=90,optimize=True,subsampling=0)
            raw=file.read_bytes();check=Image.open(io.BytesIO(raw));check.load()
            assert check.format=='JPEG' and check.size==(1080,1080) and len(raw)<2000000
            report.append({'path':str(file),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'local_qa':'PASS','public_verification':'NOT_VERIFIED','visual_approval':'PENDING_FINAL'})
          out=Path('releases/clio-founwear-cushion-original-mini-v245-five-jpg.zip');out.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(root.glob('*.jpg')):z.write(p,arcname=p.name)
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/clio-mini-v245-local-qa.json').write_text(json.dumps({'source_image':source,'source_page':'https://www.toktokbeauty.com/products/kill-cover-founwear-cushion-the-original-mini-more-colors','official_product_page':'https://clubclio.co.kr/event/eventDetail/721','shade_specific_claims':'NONE','files':report},indent=2))
          print(json.dumps(report))
          PY
      - name: Save generated assets without changing approved originals
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/images/clio-kill-cover-founwear-cushion-original-mini-sourcephoto-v245-20261101 releases/clio-founwear-cushion-original-mini-v245-five-jpg.zip evidence/clio-mini-v245-local-qa.json
          if ! git diff --cached --quiet; then
            git commit -m "Produce original-photo CLIO mini five JPGs with local QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi