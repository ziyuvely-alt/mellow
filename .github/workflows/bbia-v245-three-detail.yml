name: BBIA v245 three new-family detail JPG
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v245_three_detail_candidates.py, .github/workflows/bbia-v245-three-detail.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v245_three_detail_candidates.py --out /tmp/bbia-v245
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v245-three-new-family-photo-jpg
          path: /tmp/bbia-v245
          retention-days: 30
