name: v2983 OBgE Double Essence corrected two-formula photo-free frame
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2983-obge-double-essence-formula-onecard.yml'
      - 'scripts/v2983_obge_doubleessence_correct_twochamber_original_card.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-one-corrected-internal-photo-free-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Create one original 50mL+50mL dual formula image, old 55 approved URLs immutable
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2983-obge-doubleessence-photo-free-dual-formula-replacement-20261106
          python scripts/v2983_obge_doubleessence_correct_twochamber_original_card.py
          git add qa-review/v2983-obge-doubleessence-photo-free-dual-formula-replacement-20261106
          git diff --cached --name-only | tee /tmp/v2983-appendonly
          ! grep -Ev '^qa-review/v2983-obge-doubleessence-photo-free-dual-formula-replacement-20261106/' /tmp/v2983-appendonly
          git commit -m "QA v2983 add one original OBgE double-formula info card, mixed bottle blocked"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
