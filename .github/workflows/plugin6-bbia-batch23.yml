name: Plugin6 batch23 Korean official full detail images
on:
  push:
    branches: [plugin6-source-smoketest-20261102]
    paths: ['.github/workflows/plugin6-bbia-batch23.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: python3 -m pip install Pillow requests beautifulsoup4
      - name: Capture official image candidates for 15 remaining families
        run: python3 scripts/plugin6_bbia_batch23.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin6-bbia-batch23-official-detail-candidates
          path: plugin6-bbia-batch23-korean-detail/
          if-no-files-found: warn
