name: Shopee v2448 seven authentic product-detail JPG candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2448-seven-actual-details.yml'
      - 'scripts/v2448_seven_actual_detail_photo_frames.py'
permissions:
  contents: write
jobs:
  seven-real-photo-details:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore unchanged real photographed source assets
        shell: bash
        run: |
          mkdir prior-v2445b
          git fetch origin production-assets-v2445b-corrected-QA-hold-146
          git archive origin/production-assets-v2445b-corrected-QA-hold-146 | tar -xf - -C prior-v2445b
      - name: Produce seven distinct source-backed detail photos and verify JPGs
        run: python scripts/v2448_seven_actual_detail_photo_frames.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2448-seven-source-backed-photo-details
          path: v2448-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve new versioned JPGs without modifying source or live assets
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2448-output /tmp/v2448-qa
          git worktree add --detach /tmp/v2448-wt HEAD
          cd /tmp/v2448-wt
          git switch --orphan production-assets-v2448-seven-photo-details
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2448-qa/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve seven authentic image pixel photo detail revisions with logo and rights QA holds'
          git push origin HEAD:refs/heads/production-assets-v2448-seven-photo-details
