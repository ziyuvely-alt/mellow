name: Shopee v2678 MISSHA and CLIO two five-JPG product QA sets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2678-two-MISSHA-CLIO-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover historical source once without altering completed images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41764831639 -n shopee-v2593-definitive-156-physical-JPG-17delta-review-corpus-no-XLSX -D historical
      - name: Build real 10 JPG QA files in one batch; save to QA-only branch
        run: |
          python scripts/v2678_two_MISSHA_CLIO_qa_families.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2678-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2678-qa/qa-review/v2678-missha-clio-two-five-JPG-sets
          cp -a qa-review/v2678-missha-clio-two-five-JPG-sets /tmp/v2678-qa/qa-review/
          cd /tmp/v2678-qa
          git add qa-review/v2678-missha-clio-two-five-JPG-sets
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2678 two actual five-JPG QA product sets from MISSHA and CLIO photos'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
