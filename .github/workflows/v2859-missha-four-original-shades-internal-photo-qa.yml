name: Shopee v2859 MISSHA four actual stock shade photo-card QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2859-missha-four-original-shades-internal-photo-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reuse_existing_exact_shade_cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse exact SHA-verified MISSHA alpha files; compose four QA cards on asset branch
        run: |
          cp scripts/v2859_missha_coverlasting_four_option_qa.py /tmp/v2859.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2859qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2859qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2859.py
          git add qa-review/v2859-missha-coverlasting-four-shade-photo-cards-QA
          git commit -m 'v2859 archive four original-image MISSHA No21 23 25 27 QA cards, no sales approvals'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
