name: Shopee v2795 two exact compact real alpha object cutouts from stored official product photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2795-actual-clio-two-single-case-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy 'rembg[cpu]==2.0.67'
      - name: Produce only two new CLIO exact-object crops from already saved original official images
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2795_two_official_clio_real_single_compact_alpha.py /tmp/v2795.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2795-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2795-qa/qa-review/v2795-clio-mini-meshblur-target-only-single-case-cutout-tests
          cd /tmp/v2795-qa
          python /tmp/v2795.py
          git add qa-review/v2795-clio-mini-meshblur-target-only-single-case-cutout-tests
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2795 two exact official compact-object foreground QA candidates, no prior edits'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
