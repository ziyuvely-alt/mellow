name: Shopee v2825 source-full-lid repair for CLIO Mini 5g 21C and 21N
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2825-clio-mini-21c21n-full-lid-source-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless 'rembg[cpu]==2.0.67'
      - name: Verify top-lid correction only on actual independent 21C and 21N photographs
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          python -m py_compile scripts/v2825_clio_21c21n_full_lid_correction.py
          cp scripts/v2825_clio_21c21n_full_lid_correction.py /tmp/v2825.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2825-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2825-qa
          python /tmp/v2825.py
          git add qa-review/v2825-clio-mini-5g-21C-21N-uncropped-top-edge-repair
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2825 QA only full-lid correction for exact CLIO 21C 21N, immutable existing photos'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
