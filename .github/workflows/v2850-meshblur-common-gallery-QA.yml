name: Shopee v2850 Mesh Blur 15g refill-set common gallery source QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2850-meshblur-common-gallery-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - name: Source genuine unassigned Mesh Blur refill set scenes and stage visual QA only
        run: |
          cp scripts/v2850_meshblur_common_gallery_QA.py /tmp/v2850.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2850qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2850qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2850.py
          git add qa-review/v2850-meshblur15g-refill-product-common-scenes-QA
          git commit -m 'v2850 stock Mesh Blur 15g refill common source visual QA, no sales approval'
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
