name: Plugin6 Glow Tint official shade photo verification
on:
  push:
    branches: [plugin6-source-smoketest-20261102]
    paths: ['.github/workflows/plugin6-glow-options.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install Pillow requests beautifulsoup4
      - name: Capture official shade evidence
        run: python3 scripts/plugin6_glow_options_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin6-glow-tint-official-options-qa-only
          path: plugin6-glow-official-thai/
          if-no-files-found: warn
