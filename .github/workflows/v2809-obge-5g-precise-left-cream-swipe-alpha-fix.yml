name: Shopee v2809 OBgE 5g preserve beige product edge remove cream swipe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2809-obge-5g-precise-left-cream-swipe-alpha-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Only fix alpha mask of verified beige product and preserve all official photo frames
        run: |
          cp scripts/v2809_obge_real_cream_swatch_spatial_alpha_fix.py /tmp/v2809.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2809-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2809-qa
          python /tmp/v2809.py
          git add qa-review/v2809-obge-finisher-genuine-product-left-swipe-alpha-correction
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2809 actual OBgE 5g spatial alpha correction, preserve case edges and approved photo corpus'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
