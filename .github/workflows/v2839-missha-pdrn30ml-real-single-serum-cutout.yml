name: Shopee v2839 MISSHA PDRN serum30ml real product source alpha recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2839-missha-pdrn30ml-real-single-serum-cutout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests 'rembg[cpu]==2.0.67'
      - name: Recover actual 30mL bottle source, never another product or fact card
        env:
          U2NET_HOME: /tmp/missha-segmentation-models
        run: |
          cp scripts/v2839_real_missha_pdrn30ml_serum_cutout.py /tmp/v2839.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2839-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2839-qa
          python /tmp/v2839.py
          git add qa-review/v2839-missha-pdrn-serum30ml-correct-single-product-actual-photo-alpha
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2839 correct MISSHA serum alpha source selection and isolate actual 30mL bottle, QA only'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
