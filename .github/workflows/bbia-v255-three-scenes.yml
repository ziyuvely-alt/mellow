name: BBIA v255 three new product detail candidate scenes
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v255_three_photo_scenes.py, .github/workflows/bbia-v255-three-scenes.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v255_three_photo_scenes.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v255-three-official-photo-detail-candidates
          path: /tmp/bbia-v255
          retention-days: 30
