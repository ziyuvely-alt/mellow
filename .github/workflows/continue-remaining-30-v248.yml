name: Shopee v248 continuous production of remaining families
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v248.py'
permissions:
  contents: read
jobs:
  continuous-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified image processing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install requests Pillow
      - name: Produce eligible queued families without recreating previous drafts
        run: python scripts/continue_remaining_30_v248.py
      - name: Save JPG output and SHA manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v248-continuous-next-families
          path: production-continuation-v248/
          if-no-files-found: warn
