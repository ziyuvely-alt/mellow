name: Shopee v2411 missing-frame production and source recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2411.py'
permissions:
  contents: write
  actions: read
jobs:
  production-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and HTML libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow requests beautifulsoup4
      - name: Restore saved v2410 JPEGs unchanged from persistent branch
        run: |
          mkdir -p input-v2410-cache
          git fetch origin production-assets-v2410
          git archive FETCH_HEAD | tar -xf - -C input-v2410-cache
      - name: Audit 30 families and capture new authentic product-photo candidates
        run: python scripts/continue_remaining_30_v2411.py
      - name: Upload all kept JPGs and source provenance as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2411-production-recovery
          path: production-v2411/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist to separate production assets branch
        if: success()
        run: |
          cp -a production-v2411 /tmp/production-v2411-checkpoint
          git switch -C production-assets-v2411
          git rm -r --cached . >/dev/null 2>&1 || true
          cp -a /tmp/production-v2411-checkpoint/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Persist v2.4.11 JPGs, source evidence and similarity audit"
          git push origin HEAD:refs/heads/production-assets-v2411
