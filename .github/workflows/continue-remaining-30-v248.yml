name: Shopee v2418c final clean OBgE 300ml photo correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2418c.py'
permissions:
  contents: write
  actions: read
jobs:
  final-photo-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow requests
      - name: Restore previous complete 12-family versioned archive
        run: |
          mkdir -p input-v2418b
          git fetch origin production-assets-v2418b-clean
          git archive FETCH_HEAD | tar -xf - -C input-v2418b
      - name: Replace model advertisement with verified OBgE official standalone photo
        run: python scripts/continue_remaining_30_v2418c.py
      - name: Save corrected JPG, previous originals, proof and 12 review sets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2418c-final-B12-clean
          path: production-v2418c/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve correction in separate working branch
        if: success()
        run: |
          cp -a production-v2418c /tmp/v2418c-proof
          git worktree add --detach /tmp/v2418c-wt HEAD
          cd /tmp/v2418c-wt
          git switch --orphan production-assets-v2418c-final
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2418c-proof/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve v2418c final clean 12-family review images and source provenance"
          git push origin HEAD:refs/heads/production-assets-v2418c-final
