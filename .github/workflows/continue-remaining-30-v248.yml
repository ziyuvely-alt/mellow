name: Shopee v2416c official 145ml information continuation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2416c.py'
permissions:
  contents: write
  actions: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Restore existing 158 JPEGs unchanged
        run: |
          mkdir -p input-v2416
          git fetch origin production-assets-v2416
          git archive FETCH_HEAD | tar -xf - -C input-v2416
      - name: Produce two evidence-only information frames
        run: python scripts/continue_remaining_30_v2416c.py
      - name: Save JPEGs and SHA256 as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2416c-145ml-info-continuation
          path: production-v2416-continuation/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve separately from public approved images
        if: success()
        run: |
          cp -a production-v2416-continuation /tmp/v2416c-assets
          git worktree add --detach /tmp/v2416c-wt HEAD
          cd /tmp/v2416c-wt
          git switch --orphan production-assets-v2416c
          git rm -r --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2416c-assets/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve all 158 prior JPG and two new Pixelpure information panels"
          git push origin HEAD:refs/heads/production-assets-v2416c
