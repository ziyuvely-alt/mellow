name: Shopee v249 continuous distinct-source JPG production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v249.py'
permissions:
  contents: write
  actions: read
jobs:
  continuous-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Recover exact five prior JPG and 26 multiview files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input-v248-five input-v249-multiview input-v249-cache
          gh run download 41341935443 -n shopee-v248-continuous-next-families -D input-v248-five
          gh run download 41332343704 -n shopee-eight-multiview-source-evidence-v249 -D input-v249-multiview
          if git fetch origin production-assets-v249; then
            git archive FETCH_HEAD | tar -xf - -C input-v249-cache
          fi
      - name: Process all 30 families and save distinct candidate frames
        run: python scripts/continue_remaining_30_v249.py
      - name: Upload complete provenance and produced frames as Actions Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v249-production-checkpoint
          path: production-v249/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist non-public production cache on separate Git branch
        if: success()
        run: |
          mkdir -p /tmp/shopee-production-staging
          cp -a production-v249/pending-* /tmp/shopee-production-staging/ 2>/dev/null || true
          cp -a production-v249/summary.json production-v249/family_checkpoint.csv production-v249/frame_sha256_manifest.csv /tmp/shopee-production-staging/
          if git show-ref --verify --quiet refs/remotes/origin/production-assets-v249; then
            git switch -C production-assets-v249 origin/production-assets-v249
          else
            git switch --orphan production-assets-v249
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          cp -a /tmp/shopee-production-staging/. .
          git add pending-* summary.json family_checkpoint.csv frame_sha256_manifest.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Persist v249 non-public JPG production checkpoint"
          git push origin HEAD:refs/heads/production-assets-v249
