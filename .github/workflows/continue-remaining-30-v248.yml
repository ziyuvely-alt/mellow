name: Shopee v2412b missing informational-frame continuation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2412b.py'
permissions:
  contents: write
  actions: read
jobs:
  information-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JPEG creation libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Restore unchanged existing v2412 JPG assets
        run: |
          mkdir -p input-v2412-cache
          git fetch origin production-assets-v2412
          git archive FETCH_HEAD | tar -xf - -C input-v2412-cache
      - name: Produce new 11 documented information JPGs
        run: python scripts/continue_remaining_30_v2412b.py
      - name: Preserve JPG, provenance and SHA256 as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2412b-information-production
          path: production-v2412b/
          retention-days: 90
          if-no-files-found: warn
      - name: Create immutable long-term production asset branch
        if: success()
        run: |
          cp -a production-v2412b /tmp/shopee-v2412b-checkpoint
          git worktree add --detach /tmp/shopee-v2412b-persist HEAD
          cd /tmp/shopee-v2412b-persist
          git switch --orphan production-assets-v2412b
          git rm -r --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/shopee-v2412b-checkpoint/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve verified information panels v2412b and earlier JPGs unchanged"
          git push origin HEAD:refs/heads/production-assets-v2412b
