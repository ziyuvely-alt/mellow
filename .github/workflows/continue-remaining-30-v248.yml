name: Shopee v2413 production-frame continuation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2413.py'
permissions:
  contents: write
  actions: read
jobs:
  continuous-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and photograph processing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow requests
      - name: Recover verified existing v2412b JPG bytes
        run: |
          mkdir -p input-v2412b-cache
          git fetch origin production-assets-v2412b
          git archive FETCH_HEAD | tar -xf - -C input-v2412b-cache
      - name: Produce missing official-fact and real-photo candidate frames
        run: python scripts/continue_remaining_30_v2413.py
      - name: Export candidate JPGs and SHA / source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2413-curated-production
          path: production-v2413/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist to immutable private-production-branch version
        if: success()
        run: |
          cp -a production-v2413 /tmp/production-v2413-checkpoint
          git worktree add --detach /tmp/v2413-asset-worktree HEAD
          cd /tmp/v2413-asset-worktree
          git switch --orphan production-assets-v2413
          git rm -r --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/production-v2413-checkpoint/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve v2413 new informational and sourced photo JPGs"
          git push origin HEAD:refs/heads/production-assets-v2413
