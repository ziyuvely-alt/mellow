name: Shopee v2418b clean-source corrections for 3 B candidate frames
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2418b.py'
permissions:
  contents: write
  actions: read
jobs:
  clean-photo-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install processing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow requests
      - name: Restore previous v2418 JPGs and full approved-preservation set
        run: |
          mkdir -p input-v2418
          git fetch origin production-assets-v2418-B12
          git archive FETCH_HEAD | tar -xf - -C input-v2418
      - name: Produce correct non-watermarked product photo alternatives
        run: python scripts/continue_remaining_30_v2418b.py
      - name: Upload corrected review sets, source originals, SHA verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2418b-clean-source-fix
          path: production-v2418b/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve corrected versions in nonpublic branch
        if: success()
        run: |
          cp -a production-v2418b /tmp/shopee-v2418b-preserve
          git worktree add --detach /tmp/shopee-v2418b-worktree HEAD
          cd /tmp/shopee-v2418b-worktree
          git switch --orphan production-assets-v2418b-clean
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/shopee-v2418b-preserve/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve all v2418 prior JPG and clean retailer/official alternatives"
          git push origin HEAD:refs/heads/production-assets-v2418b-clean
