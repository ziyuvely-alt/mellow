name: Shopee v2417 authentic photo pair and curated 5-frame sets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2417.py'
permissions:
  contents: write
  actions: read
jobs:
  photo-curation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow requests
      - name: Restore newest source JPEG checkpoint
        run: |
          mkdir -p input-v2416c
          git fetch origin production-assets-v2416c
          git archive FETCH_HEAD | tar -xf - -C input-v2416c
      - name: Produce real-image candidates and five-frame review sets
        run: python scripts/continue_remaining_30_v2417.py
      - name: Upload actual images and SHA256 provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2417-curated-five-frame-sets
          path: production-v2417/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist all original photo bytes and curated candidates
        if: success()
        run: |
          cp -a production-v2417 /tmp/shopee-v2417-backup
          git worktree add --detach /tmp/shopee-v2417-worktree HEAD
          cd /tmp/shopee-v2417-worktree
          git switch --orphan production-assets-v2417-photo-curation
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/shopee-v2417-backup/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve 160 originals and independent DrG Goodal image candidate sets"
          git push origin HEAD:refs/heads/production-assets-v2417-photo-curation
