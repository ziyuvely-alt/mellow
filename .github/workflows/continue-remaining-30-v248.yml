name: Shopee v2412 verified information frame production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-remaining-30-v248.yml'
      - 'scripts/continue_remaining_30_v2412.py'
permissions:
  contents: write
  actions: read
jobs:
  information-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Restore unchanged 92 JPGs from persistent v2411 branch
        run: |
          mkdir -p input-v2411-cache
          git fetch origin production-assets-v2411
          git archive FETCH_HEAD | tar -xf - -C input-v2411-cache
      - name: Run full roster information-production queue
        run: python scripts/continue_remaining_30_v2412.py
      - name: Save complete v2412 output and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2412-official-information-frames
          path: production-v2412/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist versioned production checkpoint separate from public sales paths
        if: success()
        run: |
          cp -a production-v2412 /tmp/shopee-v2412-checkpoint
          git worktree add --detach /tmp/shopee-v2412-persist HEAD
          cd /tmp/shopee-v2412-persist
          git switch --orphan production-assets-v2412
          git rm -r --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/shopee-v2412-checkpoint/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve v2412 distinct information JPGs and evidence-based manifest"
          git push origin HEAD:refs/heads/production-assets-v2412
