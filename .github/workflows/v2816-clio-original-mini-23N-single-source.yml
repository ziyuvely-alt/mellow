name: Shopee v2816 CLIO exact 5g single 23N independent real photo QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2816-clio-original-mini-23N-single-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests beautifulsoup4
      - name: Source new exact The Original Mini 5g #23N photo without including kits
        run: |
          python scripts/v2816_clio_original_mini_23N_real_source.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2816-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2816-qa/qa-review/v2816-clio-original-mini-5g-23N-real-single-unit-source
          cp -a qa-review/v2816-clio-original-mini-5g-23N-real-single-unit-source /tmp/v2816-qa/qa-review/
          cd /tmp/v2816-qa
          git add qa-review/v2816-clio-original-mini-5g-23N-real-single-unit-source
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2816 independently source exact CLIO mini 5g 23N real gallery, preserve old 7108'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
