name: Shopee v2436 three genuine-source JPG draft repairs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2436-three-real-photo-drafts.yml'
      - 'scripts/v2436_three_actual_original_photo_edits.py'
permissions:
  contents: write
jobs:
  real-source-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover unchanged photo originals
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Produce original-photo drafts for three product families
        run: python scripts/v2436_three_actual_original_photo_edits.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2436-three-genuine-photo-customer-drafts
          path: v2436-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve versions without touching published image paths
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2436-output /tmp/v2436-save
          git worktree add --detach /tmp/v2436-wt HEAD
          cd /tmp/v2436-wt
          git switch --orphan production-assets-v2436-three-source-photo-drafts
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2436-save/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save three genuine product photo layout drafts with no unverified MK badge'
          git push origin HEAD:refs/heads/production-assets-v2436-three-source-photo-drafts
