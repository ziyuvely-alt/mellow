name: Shopee v2583 exact OBgE double essence 50+50ml image card
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2583_obge_double_essence_actual_facts_card.py'
      - '.github/workflows/v2583-double-essence-facts-card.yml'
permissions:
  contents: read
  actions: read
jobs:
  real-source-factual-card:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse original product scene, never gather unrelated product thumbnails
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41753618979 -n shopee-v2560-six-candidate-156-JPG-isolated-review-corpus-no-XLSX -D v2583-original
      - name: Render one verified 50ml plus 50ml product-info QA photo frame
        run: python scripts/v2583_obge_double_essence_actual_facts_card.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2583-obge-double-essence-real-photo-factual-info-QA-no-XLSX
          path: v2583-obge-double-essence-source-reuse-factual-card/
          retention-days: 90
          if-no-files-found: error
