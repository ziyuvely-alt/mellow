name: Shopee v2446b separate 64 MK-matched frames and 86 unapproved candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2446b-isolate-logo-matches.yml'
      - 'scripts/v2446b_isolate_60_new_logo_matches.py'
permissions:
  contents: write
jobs:
  isolate-and-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore previously verified immutable JPGs and new visual classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir prior-v2445b prior-v2446
          git fetch origin production-assets-v2445b-corrected-QA-hold-146 production-assets-v2446-all-150-logo-QA
          git archive origin/production-assets-v2445b-corrected-QA-hold-146 | tar -xf - -C prior-v2445b
          git archive origin/production-assets-v2446-all-150-logo-QA | tar -xf - -C prior-v2446
      - name: Isolate high-confidence visual MK matches while preserving all original JPEG bytes
        run: python scripts/v2446b_isolate_60_new_logo_matches.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2446b-64-MK-logo-quarantine-86-rights-hold
          path: v2446b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve evidence on separate orphan branch only
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2446b-output /tmp/v2446b-result
          git worktree add --detach /tmp/v2446b-wt HEAD
          cd /tmp/v2446b-wt
          git switch --orphan production-assets-v2446b-logo-64-quarantine-86-hold
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2446b-result/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Separate high-confidence unauthenticated MK seal images, 86 remain independently blocked'
          git push origin HEAD:refs/heads/production-assets-v2446b-logo-64-quarantine-86-hold
