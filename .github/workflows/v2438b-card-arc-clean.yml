name: Shopee v2438b remove residual info-card arc fragments
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2438b-card-arc-clean.yml'
      - 'scripts/v2438b_remove_residual_card_arc.py'
permissions:
  contents: write
jobs:
  repair-residual-arc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore only prior actual edited images
        run: |
          mkdir baseline-v2438
          git fetch origin production-assets-v2438-two-card-layout-fixes
          git archive origin/production-assets-v2438-two-card-layout-fixes | tar -xf - -C baseline-v2438
      - name: Correct residual arcs only
        run: python scripts/v2438b_remove_residual_card_arc.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2438b-two-clean-card-customer-JPGs
          path: v2438b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve new drafts and checksum evidence
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2438b-output /tmp/v2438b-save
          git worktree add --detach /tmp/v2438b-wt HEAD
          cd /tmp/v2438b-wt
          git switch --orphan production-assets-v2438b-clean-two-card-drafts
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2438b-save/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve v2438b two corrected info cards without right-edge arc'
          git push origin HEAD:refs/heads/production-assets-v2438b-clean-two-card-drafts
