name: Shopee v2867 Founwear 21C 21N actual swatch sources internal QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2867-clio-founwear-21c21n-real-swatch-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage_labeled_swatch_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Preserve exact source photo bytes and build internal review cards only
        run: |
          cp scripts/v2867_clio_founwear_21c21n_authentic_swatch_source_QA.py /tmp/v2867.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2867qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2867qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2867.py
          git add qa-review/v2867-founwear-21C-21N-real-swatch-source-evidence-QA
          git commit -m 'v2867 archive third party original swatch source-only QA for 21C and 21N; no sales release'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
