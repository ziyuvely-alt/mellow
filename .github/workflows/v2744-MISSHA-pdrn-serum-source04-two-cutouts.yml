name: Shopee v2744 MISSHA PDRN serum genuine bottle official photo alpha
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2744-MISSHA-pdrn-serum-source04-two-cutouts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  serum:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install two independent real foreground segmentation methods
        run: python -m pip install Pillow numpy opencv-python-headless 'rembg[cpu]==2.0.67'
      - name: Segment only actual manufacturer 30mL serum bottle not old fact card
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2744_missha_serum_real_bottle_source04.py /tmp/v2744.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2744-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2744-qa
          python /tmp/v2744.py
          git add qa-review/v2744-MISSHA-PDRN-30mL-single-official-bottle-two-alpha-qa
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2744 actual MIS SHA PDRN 30mL single bottle foreground QA, no prior photo mutation'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
