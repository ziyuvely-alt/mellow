name: Shopee v2954 preserve 15 real JPG into 3 internal five-frame ZIPs
on:
  push:
    branches:
      - 'qa-assets/v2662-immutable-14-candidates'
    paths:
      - '.github/workflows/v2954-stage-three-families-source-ZIPs.yml'
      - 'scripts/v2954_stage_three_families_immutable_fiveJPG_zip_QA.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve-original-source-jpgs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for internal contact previews
        run: python -m pip install --quiet Pillow
      - name: Create three byte-identical internal QA ZIPs, no commercial release
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2954-three-family-five-original-JPG-byteexact-ZIPs-20261106
          python scripts/v2954_stage_three_families_immutable_fiveJPG_zip_QA.py
          git add qa-review/v2954-three-family-five-original-JPG-byteexact-ZIPs-20261106
          git diff --cached --name-only | tee /tmp/v2954-changed
          ! grep -Ev '^qa-review/v2954-three-family-five-original-JPG-byteexact-ZIPs-20261106/' /tmp/v2954-changed
          git commit -m "QA v2954: 15 original JPGs preserved in three product-first ZIPs and QA contact previews"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
