name: Shopee v2832 two exact shade five-frame Mesh Glow Essential Mini QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2832-clio-meshglow-two-shade-five-photo-QA.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Copy 10 original JPG bytes to separate 21C and 21N internal QA references
        run: |
          cp scripts/v2832_clio_meshglow_two_5photo_internal_QA.py /tmp/v2832.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2832review qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2832review
          python /tmp/v2832.py
          git add qa-review/v2832-meshglow-essential-mini5g-21C-21N-five-image-internal-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2832 preserve two 5-scene shade-scoped photo QA sets, no photo sale release'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
