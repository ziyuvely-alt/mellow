name: Shopee v2489 DrG Moisture Sun 50ml three source-backed photo JPG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2489-drg-moisture-three.yml'
      - 'scripts/v2489_drg_moisture_three_exact_frames.py'
permissions:
  actions: read
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore already captured verified DrG exact-product source bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41688289575 -n shopee-v2488-DrG-Moisture-Sun-50ml-real-photo-sources-QA-HOLD -D v2488-drg-moisture-exact-photos
      - name: Create exactly three new customer JPG drafts only
        run: python scripts/v2489_drg_moisture_three_exact_frames.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2489-drg-moisture-sun-three-draft-JPG-QA-HOLD
          path: v2489-drg-moisture-three-new-JPG/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve JPGs without publishing product images
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2489-drg-moisture-three-new-JPG /tmp/v2489-images
          git worktree add --detach /tmp/v2489-wt HEAD
          cd /tmp/v2489-wt
          git switch --orphan production-assets-v2489-drg-moisture-three
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2489-images/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve three distinct genuine-photo DrG moisture sunscreen JPG candidates'
          git push origin HEAD:refs/heads/production-assets-v2489-drg-moisture-three
