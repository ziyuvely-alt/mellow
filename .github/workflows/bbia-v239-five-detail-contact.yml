name: BBIA v239 five-family unused detail photos contact
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v239_five_detail_contact.py, .github/workflows/bbia-v239-five-detail-contact.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v239_five_detail_contact.py --out /tmp/bbia-v239
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v239-unused-five-product-detail-regions
          path: /tmp/bbia-v239
          retention-days: 30
