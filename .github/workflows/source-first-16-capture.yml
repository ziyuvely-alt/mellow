name: Shopee source-first 16 image capture
on:
  push:
    branches: [main]
    paths:
      - 'scripts/source_first_16_capture.py'
      - 'evidence/source-first-16.json'
      - '.github/workflows/source-first-16-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image capture packages
        run: |
          pip install requests Pillow playwright
          python -m playwright install chromium --with-deps
      - name: Capture original image URLs and rendered image elements
        run: |
          cp evidence/source-first-16.json source-first-16.json
          python scripts/source_first_16_capture.py
      - name: Save source-photo evidence ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-source-first-16-20261031
          path: source-first-output/
          if-no-files-found: warn
