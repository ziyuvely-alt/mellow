name: BBIA v307 Lucky Shine Tint unseen source QA
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v307_lucky_tint_unused.py, .github/workflows/bbia-v307-lucky-unseen.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v307_lucky_tint_unused.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v307-lucky-two-unseen-official-sources
          path: /tmp/bbia-v307
          retention-days: 30
