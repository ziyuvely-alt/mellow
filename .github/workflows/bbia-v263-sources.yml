name: BBIA v263 two untouched product sources
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v263_two_product_source_archive.py, .github/workflows/bbia-v263-sources.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v263_two_product_source_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v263-two-product-four-original-source-images
          path: /tmp/bbia-v263
          retention-days: 30
