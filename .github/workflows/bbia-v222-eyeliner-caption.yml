name: BBIA v222 eyeliner 03 Korean caption selective cleanup
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v222_eyeliner_caption_cleanup.py
      - .github/workflows/bbia-v222-eyeliner-caption.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - name: Create QA-only targeted English clean caption
        run: python scripts/bbia_v222_eyeliner_caption_cleanup.py --out /tmp/bbia-v222
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v222-eyeliner-03-targeted-caption-qa-pending
          path: /tmp/bbia-v222
          retention-days: 30
