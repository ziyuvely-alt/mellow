name: Shopee v2921 PixelPure two Korean official gallery unseen original QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2921-pixelpure-two-KR-official-native-source.yml'
      - 'scripts/v2921_pixelpure_two_KR_official_gallery_unseen_native_photos.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover_only_new_brand_photos:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests beautifulsoup4
      - name: Discover only unseen product-gallery native source images, no prior updates
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2921_pixelpure_two_KR_official_gallery_unseen_native_photos.py
          cp scripts/v2921_pixelpure_two_KR_official_gallery_unseen_native_photos.py /tmp/v2921.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2921qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2921qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2921-pixelpure-KR-two-family-unseen-product-gallery-source-QA
          python /tmp/v2921.py
          git add qa-review/v2921-pixelpure-KR-two-family-unseen-product-gallery-source-QA
          git diff --cached --name-only | tee /tmp/v2921-changed
          ! grep -Ev '^qa-review/v2921-pixelpure-KR-two-family-unseen-product-gallery-source-QA/' /tmp/v2921-changed
          git commit -m 'v2921 PixelPure two family first-party Korean native source discovery with old images protected'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
