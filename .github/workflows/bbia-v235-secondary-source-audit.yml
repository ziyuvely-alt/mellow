name: BBIA v235 13-family second-role source audit
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - .github/workflows/bbia-v235-secondary-source-audit.yml
      - scripts/bbia_v235_secondary_source_audit.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - name: Batch probe two real alternate official detail references per 13 family
        run: python scripts/bbia_v235_secondary_source_audit.py --out /tmp/bbia-v235
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbia-v235-second-role-source-evidence-and-contact
          path: /tmp/bbia-v235
          retention-days: 30
          if-no-files-found: error
