name: Shopee v2553 CLIO 3 family exact-six-JPG scene diversity and SKU review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2553_clio_three_family_physical_review.py'
      - '.github/workflows/v2553-clio-three-family-qa.yml'
permissions:
  contents: read
  actions: read
jobs:
  actual-image-QA:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore immutable v2548 original 156 JPGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41715911900 -n shopee-v2548-156-JPG-Pixelpure-Aura-Serum-2real-scenes-QA -D v2553-input
      - name: Review all six actual JPGs per CLIO family and exact shade scope
        run: python scripts/v2553_clio_three_family_physical_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2553-CLIO-3family-18-actual-image-scene-QA-no-XLSX
          path: v2553-clio-three-family-proof/
          retention-days: 90
          if-no-files-found: error
