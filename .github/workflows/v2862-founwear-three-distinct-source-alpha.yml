name: Shopee v2862 CLIO Founwear three distinct original photo truealpha QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2862-founwear-three-distinct-source-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  three_founwear_variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless
      - name: Reuse only three distinguished merchant photos and hold near-duplicates
        run: |
          cp scripts/v2862_clio_founwear_three_selected_truealpha_qa.py /tmp/v2862.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2862qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2862qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2862.py
          git add qa-review/v2862-clio-founwear-three-distinct-source-truealpha-QA
          git commit -m 'v2862 store selected verified-shade source true alpha quality candidates, preserve 55 public URLs'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
