name: Shopee v2842 CLIO Mini 23N geometry-registered exact RGB alpha QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2842-clio-mini23n-registered-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa_23n:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless
      - name: Register existing mask onto exact 23N RGB without redownloading or regenerating prior photographs
        run: |
          cp scripts/v2842_clio_mini23N_registered_alpha.py /tmp/v2842-clio.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2842-clio-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2842-clio-qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2842-clio.py
          git add qa-review/v2842-clio-mini5g-23N-native-registered-alpha-QA
          git commit -m 'v2842 exact 23N product QA and fail-closed geometric mask registration; no sale assets touched'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
