name: Shopee v2912 eight-family visually screened preflight 5 slot QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2912-eight-family-visual-candidate-filter.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  safely_curate_existing_8family_photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Build new internal source shortlist from eight v2911 visual reviews
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2912_eight_family_visually_cured_clean_photo_slots.py
          cp scripts/v2912_eight_family_visually_cured_clean_photo_slots.py /tmp/v2912.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2912work qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2912work
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2912-eight-family-preflight-visual-picks-no-fabricated-slots-QA
          python /tmp/v2912.py
          git add qa-review/v2912-eight-family-preflight-visual-picks-no-fabricated-slots-QA
          git diff --cached --name-only | tee /tmp/v2912-changed
          ! grep -Ev '^qa-review/v2912-eight-family-preflight-visual-picks-no-fabricated-slots-QA/' /tmp/v2912-changed
          git commit -m 'v2912 visually screen 8 families, stage candidate photo slots without fake images or prior edits'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
