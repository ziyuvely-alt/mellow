name: Shopee v2716 two alternate real-source product alpha cutouts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2716-obge-goodal-alternate-cutouts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual neural segmentation
        run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Segment OBGE single compact 5g and alternate GOODAL tube source, preserve previous approved assets
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          python -m py_compile scripts/v2716_two_alternate_original_product_cutouts.py
          cp scripts/v2716_two_alternate_original_product_cutouts.py /tmp/v2716.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2716-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2716-qa
          python /tmp/v2716.py
          git add qa-review/v2716-obge-finisher-and-goodal-alternate-real-alpha
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2716 actual background removal candidate on two alternate exact-product photos, QA only'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
