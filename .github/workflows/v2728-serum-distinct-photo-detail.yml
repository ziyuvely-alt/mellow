name: Shopee v2728 MISSHA 30mL second genuinely distinct photo detail
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2728-serum-distinct-photo-detail.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Produce separate real source03 product opened-bottle/dropper detail alpha JPEG and transparent PNG
        env:
          U2NET_HOME: /tmp/isnet-model-weights
        run: |
          python -m py_compile scripts/v2728_serum_second_independent_source_detail.py
          cp scripts/v2728_serum_second_independent_source_detail.py /tmp/v2728.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2728 qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2728
          test ! -e qa-review/v2728-serum-independent-pipette-product-detail-QA
          python /tmp/v2728.py
          git add qa-review/v2728-serum-independent-pipette-product-detail-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2728 new distinct-source open 30mL serum/dropper close-up QA with true alpha'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
