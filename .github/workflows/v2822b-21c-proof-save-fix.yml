name: Shopee v2822b exact 21C variant photo output path correction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2822b-21c-proof-save-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify21c:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - name: Preserve exact shade 21C standalone variant photo or explicit hold
        run: |
          python -m py_compile scripts/v2822b_clio_21c_variant_source_patch.py
          python scripts/v2822b_clio_21c_variant_source_patch.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2822b-review qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2822b-review/qa-review/v2822b-clio-original-mini-5g-21C-exact-variant-gallery-proof
          cp -a qa-review/v2822b-clio-original-mini-5g-21C-exact-variant-gallery-proof /tmp/v2822b-review/qa-review/
          cd /tmp/v2822b-review
          git add qa-review/v2822b-clio-original-mini-5g-21C-exact-variant-gallery-proof
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2822b 21C Lingerie exact variant photo or evidence-only hold, approved 21N 23N unchanged'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
