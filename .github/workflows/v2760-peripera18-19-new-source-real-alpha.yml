name: Shopee v2760 alternate real PERIPERA 18 and 19 original source QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2760-peripera18-19-new-source-real-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  new-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests 'rembg[cpu]==2.0.67'
      - name: Switch to different full-photo original 18 and 19 source, never retry prior clipped alpha
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          python scripts/v2760_two_legacy_peripera_alternate_source_cutouts.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2760-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2760-qa/qa-review/v2760-peripera-18-19-alternate-actual-photo-alpha
          cp -a qa-review/v2760-peripera-18-19-alternate-actual-photo-alpha /tmp/v2760-qa/qa-review/
          cd /tmp/v2760-qa
          git add qa-review/v2760-peripera-18-19-alternate-actual-photo-alpha
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2760 different full-source real 18 and 19 old-edition cutouts, preserve previous and never release'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
