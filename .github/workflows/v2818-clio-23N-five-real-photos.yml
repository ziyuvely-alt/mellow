name: Shopee v2818 assemble five preserved CLIO 5g 23N real photos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2818-clio-23N-five-real-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Reuse one alpha and four actual distinct CLIO 23N gallery photos without regeneration
        run: |
          cp scripts/v2818_clio_23N_five_source_photo_QA.py /tmp/v2818.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2818-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2818-qa
          python /tmp/v2818.py
          git add qa-review/v2818-clio-23N-five-distinct-real-photo-QA-set
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2818 five CLIO mini 23N actual photos, prior copies sha identical, 21N gated'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
