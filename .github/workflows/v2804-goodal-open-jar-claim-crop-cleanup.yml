name: Shopee v2804 remove clipped GOODAL claim from exact one photo frame
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2804-goodal-open-jar-claim-crop-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reframe only GOODAL slot 02 using authentic original photo, keep 4 hashes
        run: |
          cp scripts/v2804_goodal_open_jar_no_marketing_heading.py /tmp/v2804.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2804-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2804-qa
          python /tmp/v2804.py
          git add qa-review/v2804-goodal-alpha-open-jar-no-clipped-marketing-copy-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2804 fix GOODAL frame02 clipped claim from original open jar photograph, preserve 4 exact JPGs'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
