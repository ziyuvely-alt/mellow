name: Shopee v2562 two remaining distinct QA picture candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2562_two_frame05_candidate_layout.py'
      - '.github/workflows/v2562-two-QA-candidates.yml'
permissions:
  actions: read
  contents: read
jobs:
  two-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore latest immutable 156 image QA pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41753618979 -n shopee-v2560-six-candidate-156-JPG-isolated-review-corpus-no-XLSX -D input
      - name: Build two QA-only frames
        run: python scripts/v2562_two_frame05_candidate_layout.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2562-MISSHA-CLIO-slot05-pair-new-QA-JPG-no-XLSX
          path: v2562-review/
          retention-days: 90
