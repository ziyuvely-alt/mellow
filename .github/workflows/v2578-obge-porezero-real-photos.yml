name: Shopee v2578 two actual OBgE Pore Zero 50ml source scenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2578_obge_porezero_two_distinct_real_source_scenes.py'
      - '.github/workflows/v2578-obge-porezero-real-photos.yml'
permissions:
  contents: read
  actions: read
jobs:
  fetch-two-actual-product-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore existing product family photos, not rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41753618979 -n shopee-v2560-six-candidate-156-JPG-isolated-review-corpus-no-XLSX -D v2578-previous
      - name: Download two independent OBgE exact-tube product source photographs
        run: python scripts/v2578_obge_porezero_two_distinct_real_source_scenes.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2578-two-true-OBGE-PoreZero-50ml-photo-sources-QA-no-XLSX
          path: v2578-two-real-obge-porezero-source-scenes/
          retention-days: 90
          if-no-files-found: error
