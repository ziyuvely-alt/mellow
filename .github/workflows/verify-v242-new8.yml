name: Verify 8 new MellowKR image URLs v242
on:
  push:
    branches: [main]
    paths:
      - 'evidence/v242-new8-image-manifest.json'
      - 'scripts/verify_v242_new8.py'
      - '.github/workflows/verify-v242-new8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/verify_v242_new8.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v242-new8-public-verification
          path: v242-public-new8-report.json
          if-no-files-found: warn
