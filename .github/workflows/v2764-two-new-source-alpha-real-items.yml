name: Shopee v2764 two alternate genuine source photo alpha candidates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2764-two-new-source-alpha-real-items.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Two genuine new original source scenes, no prior product image edits
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2764_two_alternate_original_photo_alpha.py /tmp/v2764.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2764-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2764-qa
          test ! -e qa-review/v2764-two-new-original-source-real-alpha-QA
          python /tmp/v2764.py
          git add qa-review/v2764-two-new-original-source-real-alpha-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2764 two alternate actual product photo cutouts, SHA originals intact'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
