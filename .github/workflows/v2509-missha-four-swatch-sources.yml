name: Shopee v2509 MISSHA Cover Lasting four real shade chart references
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2509-missha-four-swatch-sources.yml'
      - 'scripts/v2509_missha_exact_four_shade_sources.py'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Acquire four-shade photographs as QA-only sources
        run: python scripts/v2509_missha_exact_four_shade_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2509-missha-cover-four-shades-real-reference-QA
          path: v2509-missha-four-shade-source-review/
          retention-days: 90
          if-no-files-found: error
