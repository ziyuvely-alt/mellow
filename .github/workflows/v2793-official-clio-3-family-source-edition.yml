name: Shopee v2793 inspect 3 remaining CLIO family official product generations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2793-official-clio-3-family-source-edition.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow requests beautifulsoup4
      - name: Read exact product official editions and archive reference-only photographs
        run: |
          cp scripts/v2793_clio_three_family_official_photo_source_audit.py /tmp/v2793.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2793-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2793-qa
          python /tmp/v2793.py
          git add qa-review/v2793-three-clio-remaining-families-exact-page-edition-and-photo-proof
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2793 official CLIO source photo refs for remaining three blocked product families, no commercial rights claim'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
