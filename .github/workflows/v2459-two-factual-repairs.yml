name: Shopee v2459 two factual customer info JPG repairs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2459-two-factual-repairs.yml'
      - 'scripts/v2459_two_corrected_customer_info_cards.py'
permissions:
  contents: write
jobs:
  repair-and-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Render separate 1080 customer info cards with unsupported claims removed
        run: python scripts/v2459_two_corrected_customer_info_cards.py
      - name: Archive actual JPGs as recoverable artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2459-2-corrected-JPGs-no-XLSX
          path: v2459-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve approved-for-review files in isolated Git branch, never publish
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2459-output /tmp/v2459-jpg-output
          git worktree add --detach /tmp/v2459-worktree HEAD
          cd /tmp/v2459-worktree
          git switch --orphan production-assets-v2459-safe-repair-two
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2459-jpg-output/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve factual repair JPGs for Peripera and Goodal pending final MK logo QA'
          git push origin HEAD:refs/heads/production-assets-v2459-safe-repair-two
