name: BBIA v221 eyeliner frame03 embedded Korean audit
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v221_eyeliner_frame03_audit.py
      - .github/workflows/bbia-v221-eyeliner-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - name: Audit existing original public frame without rewriting
        run: python scripts/bbia_v221_eyeliner_frame03_audit.py --out /tmp/bbia-v221
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v221-eyeliner-frame03-visual-qa
          path: /tmp/bbia-v221
          retention-days: 30
