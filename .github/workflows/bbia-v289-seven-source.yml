name: BBIA v289 final three family unseen detail source batch
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v289_seven_source_gate.py, .github/workflows/bbia-v289-seven-source.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v289_seven_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v289-7-source-photos-new-families
          path: /tmp/bbia-v289
          retention-days: 30
