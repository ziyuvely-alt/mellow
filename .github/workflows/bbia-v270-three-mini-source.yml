name: BBIA v270 remaining three mini source gate
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v270_three_remaining_mini_source_gate.py
      - .github/workflows/bbia-v270-three-mini-source.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v270_three_remaining_mini_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v270-three-mini-source-contact-and-manifest
          path: /tmp/bbia-v270
          retention-days: 30
