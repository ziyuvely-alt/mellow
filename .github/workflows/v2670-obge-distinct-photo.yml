name: Shopee v2670 OBgE official beige distinct photo selective frame repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2670-obge-distinct-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photo-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Produce official alternative only, preserve the four existing JPG SHA256
        run: |
          cp scripts/v2670_obge_one_official_photo_repair.py /tmp/v2670_obge_repair.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2670-working qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2670-working
          python /tmp/v2670_obge_repair.py
          git add qa-review/v2670-obge-300ml-distinct-official-photo-qa
          git -c user.name='QA-Archive-Bot' -c user.email='qa-archive-bot@users.noreply.github.com' commit -m 'v2670 replace only OBgE frame02 with verified alternate official source photo, preserve 4 frames'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
