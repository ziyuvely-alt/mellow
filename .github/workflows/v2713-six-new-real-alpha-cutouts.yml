name: Shopee v2713 six additional real product background cutouts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2713-six-new-real-alpha-cutouts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  six:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual segmentation
        run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Foreground alpha extraction from six preserved product JPG sources
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          python -m py_compile scripts/v2713_six_new_stock_item_cutouts.py
          cp scripts/v2713_six_new_stock_item_cutouts.py /tmp/v2713.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2713-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2713-qa
          python /tmp/v2713.py
          git add qa-review/v2713-six-new-product-hero-real-alpha-cutouts
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2713 six new QA true transparent product segmentation scenes, keep prior artifacts untouched'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
