name: Shopee v2935 two exact SKU Shopify native photo discovery QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2935-two-retailer-exact-photo-source-QA.yml'
      - 'scripts/v2935_goodal_and_bioheal_exact_retail_gallery_native_photo_QA.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect_new_exact_sku_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - name: Fetch one pass of product-specific Shopify gallery native sources, keep all old sources
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2935_goodal_and_bioheal_exact_retail_gallery_native_photo_QA.py
          cp scripts/v2935_goodal_and_bioheal_exact_retail_gallery_native_photo_QA.py /tmp/v2935.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2935qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2935qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2935-two-new-retailer-exact-SKU-image-native-source-check-QA
          python /tmp/v2935.py
          git add qa-review/v2935-two-new-retailer-exact-SKU-image-native-source-check-QA
          git diff --cached --name-only | tee /tmp/v2935changed
          ! grep -Ev '^qa-review/v2935-two-new-retailer-exact-SKU-image-native-source-check-QA/' /tmp/v2935changed
          git commit -m 'v2935 exact SKU imagery source check, keep commercial licensing and stock edition HOLD'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
