name: Plugin6 BBIA batch18 fifteen official product detail galleries
on:
  push:
    branches: [plugin6-source-smoketest-20261102]
    paths: ['.github/workflows/plugin6-bbia-batch18.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install image dependencies
        run: python3 -m pip install Pillow requests beautifulsoup4
      - name: Capture 15 official product galleries
        run: python3 scripts/plugin6_bbia_batch18.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin6-bbia-batch18-official-new-sources
          path: plugin6-bbia-batch18-korean-detail/
          if-no-files-found: warn
