name: Shopee v2440 three real customer JPG card repairs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2440-three-card-corrections.yml'
      - 'scripts/v2440_three_clean_card_revisions.py'
permissions:
  contents: write
jobs:
  real-image-revisions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore authenticated immutable source image archive
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Actual three-frame targeted JPEG repair
        run: python scripts/v2440_three_clean_card_revisions.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2440-three-customer-card-repairs
          path: v2440-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve isolated versioned draft branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2440-output /tmp/v2440-outputs
          git worktree add --detach /tmp/v2440-wt HEAD
          cd /tmp/v2440-wt
          git switch --orphan production-assets-v2440-three-card-repairs
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2440-outputs/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve three real customer JPG card repairs with source SHA256 and rights hold'
          git push origin HEAD:refs/heads/production-assets-v2440-three-card-repairs
