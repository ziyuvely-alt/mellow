name: Shopee v2866 Founwear 3 actual white-puff option cards QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2866-founwear-three-option-cards-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reuse_successful_v2864:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Compose three CLIO reference cards from immutable white-preserved alpha, no published writes
        run: |
          cp scripts/v2866_clio_founwear_3_option_qa.py /tmp/v2866.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2866qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2866qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2866.py
          git add qa-review/v2866-founwear-preserved-three-white-puff-option-QA
          git commit -m 'v2866 new three shade option QA cards from successful CLIO Founwear U2Net, rights on hold'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
