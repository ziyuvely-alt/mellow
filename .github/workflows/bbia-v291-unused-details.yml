name: BBIA v291 six unused source roles
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v291_six_unused_details.py, .github/workflows/bbia-v291-unused-details.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v291_six_unused_details.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v291-six-unused-original-details
          path: /tmp/bbia-v291
          retention-days: 30
