name: Shopee v2711 actual AI alpha cutout four stock product source photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2711-four-real-photo-alpha-cutouts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install true image segmentation dependencies
        run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Alpha segment 4 real original product sources into candidate PNG+1080 JPG only
        env:
          U2NET_HOME: /tmp/segmentation-models
        run: |
          cp scripts/v2711_four_real_photo_alpha_cutouts.py /tmp/v2711.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2711-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2711-qa
          python /tmp/v2711.py
          git add qa-review/v2711-real-segmentation-four-source-product-heroes
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2711 actual AI alpha product cutout from 4 original photos, no new logos or public images'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
