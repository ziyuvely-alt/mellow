name: Shopee v2542 stage exact OBgE 100mL double essence brand photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2542-obge-double-essence-source.yml'
      - 'scripts/v2542_obge_double_essence_exact_brand_photos.py'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/v2542_obge_double_essence_exact_brand_photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2542-OBgE-double-essence-100ml-brand-genuine-source-QA
          path: v2542-obge-double-essence-brand-source-QA/
          retention-days: 90
          if-no-files-found: error
