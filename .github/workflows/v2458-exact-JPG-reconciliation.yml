name: Shopee v2458 reconcile 30 families and quarantine two exact unsupported claims
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2458-exact-JPG-reconciliation.yml'
      - 'scripts/v2458_consolidate_30groups_117_prior_JPGs.py'
permissions:
  contents: write
jobs:
  reconcile-existing-photos-and-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore audited 38 newer and 79 older JPGs without rerendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir prior-v2455b prior-v2457b
          git fetch origin production-assets-v2455b-38-JPGs-official-shade-evidence production-assets-v2457b-79-retained-seven-quarantine
          git archive origin/production-assets-v2455b-38-JPGs-official-shade-evidence | tar -xf - -C prior-v2455b
          git archive origin/production-assets-v2457b-79-retained-seven-quarantine | tar -xf - -C prior-v2457b
      - name: SHA-verify, source-deduplicate and isolate exactly two unverified claims
        run: python scripts/v2458_consolidate_30groups_117_prior_JPGs.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2458-30group-JPG-review-withheld-claims-no-XLSX
          path: v2458-output/
          retention-days: 90
          if-no-files-found: error
      - name: Save new independent checkpoint only, no source or public URL mutations
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2458-output /tmp/v2458-review
          git worktree add --detach /tmp/v2458-wt HEAD
          cd /tmp/v2458-wt
          git switch --orphan production-assets-v2458-30group-reviewed-photo-facts
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2458-review/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve complete 30-family candidate photo pool, isolate verified unsubstantiated claim cards, no spreadsheets'
          git push origin HEAD:refs/heads/production-assets-v2458-30group-reviewed-photo-facts
