name: Shopee v2937 GOODAL 100mL two new verified product photo scenes internal QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2937-goodal-two-unseen-100ml-original-scenes.yml'
      - 'scripts/v2937_goodal_two_action_photo_source_preserve.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_check_goodal_two_product_specific_scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests beautifulsoup4
      - name: Syntax/QA preflight, no previous source modifications
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2937_goodal_two_action_photo_source_preserve.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('scripts/v2937_goodal_two_action_photo_source_preserve.py').read_text()
          assert not re.search(r',font\(\d+\),fill=',s)
          assert 'commercial_photo_rights_verified' in s and 'state["sale_approved"]' not in s
          print('v2937 static preflight OK')
          PY
      - name: Archive only novel photo source and new internal checkpoint
        run: |
          set -euo pipefail
          cp scripts/v2937_goodal_two_action_photo_source_preserve.py /tmp/v2937.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2937qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2937qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2937-goodal-serummist-100ml-two-unique-action-and-still-photo-source-QA
          python /tmp/v2937.py
          git add qa-review/v2937-goodal-serummist-100ml-two-unique-action-and-still-photo-source-QA
          git diff --cached --name-only | tee /tmp/v2937-changed
          ! grep -Ev '^qa-review/v2937-goodal-serummist-100ml-two-unique-action-and-still-photo-source-QA/' /tmp/v2937-changed
          git commit -m 'v2937 Goodal two verified 100mL product photo references; preserve existing images and rights hold'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
