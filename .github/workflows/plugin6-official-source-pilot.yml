name: Plugin6 official source pilot
on:
  push:
    branches: [plugin6-source-smoketest-20261102]
    paths: ['.github/workflows/plugin6-official-source-pilot.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install Pillow
      - name: Fetch and check official sources
        run: python3 scripts/plugin6_bbia_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin6-official-images-unverified
          path: plugin6-pilot-output/
          if-no-files-found: warn
