name: v2978 two image-family five-frame source-preserving virtual sets
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2978-two-fiveframe-original-source-gates.yml'
      - 'scripts/v2978_2family_virtual_fiveframe_QA_set.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-slot-replacements:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Verify exact ten JPG sources and two five-frame QA rosters without copying licensed files
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2978-two-five-frame-virtual-sets-reuse-existing-binaries-20261106
          python scripts/v2978_2family_virtual_fiveframe_QA_set.py
          git add qa-review/v2978-two-five-frame-virtual-sets-reuse-existing-binaries-20261106
          git diff --cached --name-only | tee /tmp/v2978-appendonly
          ! grep -Ev '^qa-review/v2978-two-five-frame-virtual-sets-reuse-existing-binaries-20261106/.*\.json$' /tmp/v2978-appendonly
          git commit -m "QA v2978: GOODAL and OBgE five image storyboards from byte-audited old refs and original new graphics"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
