name: Shopee v2431c goodal info customer JPG corrections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2431c-goodal-info-fixes.yml'
      - 'scripts/v2431c_goodal_info_fixes.py'
permissions:
  contents: write
jobs:
  correct-info:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover preserved existing JPGs
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Revise two exact text-only panels
        run: python scripts/v2431c_goodal_info_fixes.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2431c-goodal-two-sales-image-drafts
          path: v2431c-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve fresh branch without touching public assets
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2431c-output /tmp/v2431c-save
          git worktree add --detach /tmp/v2431c-wt HEAD
          cd /tmp/v2431c-wt
          git switch --orphan production-assets-v2431c-goodal-two-copy-fixes
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2431c-save/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve two actual goodal information panel fixes'
          git push origin HEAD:refs/heads/production-assets-v2431c-goodal-two-copy-fixes
