name: Shopee v2421b single customer-copy quality fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2421b-peripera-fix.yml'
      - 'scripts/v2421b_peripera_customer_copy_fix.py'
permissions:
  contents: write
  actions: read
jobs:
  one-frame-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Restore v2421 complete original asset package
        run: |
          mkdir -p input-v2421-customer
          git fetch origin production-assets-v2421-customer-en-copy
          git archive origin/production-assets-v2421-customer-en-copy | tar -xf - -C input-v2421-customer
      - name: Fix only repeated Peripera shade-range caption
        run: python scripts/v2421b_peripera_customer_copy_fix.py
      - name: Upload exact preserved and repaired JPGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2421b-final-customer-en-masters
          path: production-v2421b-final/
          retention-days: 90
          if-no-files-found: warn
      - name: Save new immutable nonpublic version branch
        if: success()
        run: |
          cp -a production-v2421b-final /tmp/v2421b-customer
          git worktree add --detach /tmp/v2421b-wt HEAD
          cd /tmp/v2421b-wt
          git switch --orphan production-assets-v2421b-customer-final
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2421b-customer/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save v2421b Peripera language clean frame with unchanged 215 original photographs"
          git push origin HEAD:refs/heads/production-assets-v2421b-customer-final
