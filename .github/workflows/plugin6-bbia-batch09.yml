name: Plugin6 BBIA batch09 blush and contour official shade capture
on:
  push:
    branches: [plugin6-source-smoketest-20261102]
    paths: ['.github/workflows/plugin6-bbia-batch09.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install Pillow requests beautifulsoup4
      - name: Capture official shade photography
        run: python3 scripts/plugin6_bbia_batch09.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin6-bbia-batch09-official-product-photos-review
          path: plugin6-bbia-batch09-official/
          if-no-files-found: warn
