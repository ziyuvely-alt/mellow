name: Shopee v2884 OBgE 300mL archived photo true alpha shoulder edge QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2884-obge300-v2857-mask-pump-edge-checker-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect_source_without_regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Pixel-audit archived original 300mL alpha and pump/base on dark and checker background, update 30 families
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2884_obge_300ml_v2857_alpha_edge_diagnostics_QA.py
          cp scripts/v2884_obge_300ml_v2857_alpha_edge_diagnostics_QA.py /tmp/v2884.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2884qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2884qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2884-obge300ml-archived-alpha-native-detail-4-panel-QA
          python /tmp/v2884.py
          git add qa-review/v2884-obge300ml-archived-alpha-native-detail-4-panel-QA
          git commit -m 'v2884 archive 300mL photo exact RGB mask edge and 600px native quality diagnostics; keep retail blocked'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
