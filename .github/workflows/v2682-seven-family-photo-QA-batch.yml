name: Shopee v2682 seven remaining real photo-led QA sets one batch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2682-seven-family-photo-QA-batch.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse historical archived photos only, no regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41764831639 -n shopee-v2593-definitive-156-physical-JPG-17delta-review-corpus-no-XLSX -D historical
      - name: Complete 7 real QA five-JPG sets, quarantine Peripera edition
        run: |
          cp scripts/v2682_seven_remaining_batch.py /tmp/v2682.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2682-qa qa-assets/v2662-immutable-14-candidates
          ln -s "$GITHUB_WORKSPACE/historical" /tmp/v2682-qa/historical
          cd /tmp/v2682-qa
          python /tmp/v2682.py
          git add qa-review/v2682-seven-remaining-five-JPG-reviews
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2682 seven real photo-led five-JPG review sets; Peripera exact shade generation remains on hold'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
