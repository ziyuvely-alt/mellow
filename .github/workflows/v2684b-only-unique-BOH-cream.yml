name: Shopee v2684b BOH cream unique source photo replacement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2684b-only-unique-BOH-cream.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse existing photo archive without regenerating
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41764831639 -n shopee-v2593-definitive-156-physical-JPG-17delta-review-corpus-no-XLSX -D historical
      - name: Skip duplicate serum and replace only cream QA image
        run: |
          cp scripts/v2684_two_BOH_photo_substitutions.py /tmp/v2684b.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2684b-assets qa-assets/v2662-immutable-14-candidates
          ln -s "$GITHUB_WORKSPACE/historical" /tmp/v2684b-assets/historical
          cd /tmp/v2684b-assets
          python /tmp/v2684b.py
          git add qa-review/v2684b-BOH-cream-only-distinct-photo
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2684b preserve four BOH cream QA frames and one distinct real photo; duplicate serum skipped'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
