name: BBIA v259 palette original source recovery
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v259_palette_original_recovery.py
      - .github/workflows/bbia-v259-palette-recovery.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v259_palette_original_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v259-palette-source-photos-and-18-band-audit
          path: /tmp/bbia-v259
          retention-days: 30
