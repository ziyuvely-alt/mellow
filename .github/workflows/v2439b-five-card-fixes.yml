name: Shopee v2439b five ornamental overlap customer image fixes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2439b-five-card-fixes.yml'
      - 'scripts/v2439b_five_real_card_overlap_repairs.py'
permissions:
  contents: write
jobs:
  five-real-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore immutable actual photographed historical JPG archive
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Correct five source-grounded customer information-card images
        run: python scripts/v2439b_five_real_card_overlap_repairs.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2439b-five-real-customer-JPG-overlap-fixes
          path: v2439b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve new QA branch without image public-path writes
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2439b-output /tmp/v2439b-saved
          git worktree add --detach /tmp/v2439b-wt HEAD
          cd /tmp/v2439b-wt
          git switch --orphan production-assets-v2439b-five-real-card-fixes
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2439b-saved/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve five actual corrected customer info JPGs and source provenance QA'
          git push origin HEAD:refs/heads/production-assets-v2439b-five-real-card-fixes
