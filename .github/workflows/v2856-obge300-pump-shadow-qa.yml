name: Shopee v2856 OBgE 300mL pump and edge alpha-only QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2856-obge300-pump-shadow-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  obge300:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Preserve actual source RGB and crop cast-shadow alpha only
        run: |
          cp scripts/v2856_obge300ml_pump_shadow_precision_alpha.py /tmp/v2856.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2856qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2856qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2856.py
          git add qa-review/v2856-obge300ml-pump-shadow-alpha-precision-QA
          git commit -m 'v2856 OBgE 300mL pump contour shadow QA improvement, no source alteration'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
