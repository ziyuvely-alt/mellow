name: Shopee v2712 recover three pale-product AI alpha cutouts with ISNET model
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2712-three-better-alpha-cutout-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual segmentation dependencies
        run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Segment only prior three failing pale item scenes, no prior asset changes
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2712_three_high_quality_cutout_recovery.py /tmp/v2712.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2712-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2712-qa
          python /tmp/v2712.py
          git add qa-review/v2712-3-failed-cutouts-high-quality-recovery
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2712 retry 3 pale product background cutouts using higher-quality ISNET alpha, no approved changes'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
