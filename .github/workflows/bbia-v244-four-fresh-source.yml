name: BBIA v244 four untouched families source QA
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v244_four_fresh_source_audit.py, .github/workflows/bbia-v244-four-fresh-source.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v244_four_fresh_source_audit.py --out /tmp/bbia-v244
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v244-four-fresh-product-source-bands
          path: /tmp/bbia-v244
          retention-days: 30
