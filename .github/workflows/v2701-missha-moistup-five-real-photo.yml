name: Shopee v2701 MISSHA Moist Up five genuine-source JPG QA set
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2701-missha-moistup-five-real-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse four saved official regional photos and one old Korean stock reference
        run: |
          cp scripts/v2701_missha_moistup_real_five.py /tmp/v2701.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2701-review qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2701-review
          python /tmp/v2701.py
          git add qa-review/v2701-missha-moistup-five-actual-product-photo-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2701 stage 5 authentic MISSHA Moist Up JPGs from existing saved sources without rewriting originals'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
