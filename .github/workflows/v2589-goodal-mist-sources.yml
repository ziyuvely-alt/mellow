name: Shopee v2589 Goodal exact 100ml 25AD two real photo sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2589_goodal_100ml_25AD_two_source_scenes.py'
      - '.github/workflows/v2589-goodal-mist-sources.yml'
permissions:
  actions: read
  contents: read
jobs:
  goodal-photo-source-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore existing image source corpus, never rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41753618979 -n shopee-v2560-six-candidate-156-JPG-isolated-review-corpus-no-XLSX -D v2589-base
      - name: Acquire two real Goodal 100ml serum mist photographs
        run: python scripts/v2589_goodal_100ml_25AD_two_source_scenes.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2589-GOODAL-100ml-25AD-two-actual-photo-scenes-QA-no-XLSX
          path: v2589-goodal-serum-mist-two-source-JPG-QA/
          retention-days: 90
          if-no-files-found: error
