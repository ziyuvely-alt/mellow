name: Shopee v2722 thirty-family file-backed cutout quality inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2722-thirty-pending-cutout-file-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Validate actual archived alpha PNGs and 1080 JPGs for 30 distinct pending families
        run: |
          cp scripts/v2722_thirty_family_physical_cutout_qa_audit.py /tmp/v2722.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2722-review qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2722-review
          python /tmp/v2722.py
          git add qa-review/v2722-thirty-family-file-backed-cutout-queue
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2722 verify all 30 pending family photo masks and source-backed blockers without product regeneration'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
