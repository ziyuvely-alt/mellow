name: Shopee v2429c remaining fourteen pending-image QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2429c-remaining14.yml'
      - 'scripts/v2429c_remaining14_qa.py'
permissions:
  contents: write
jobs:
  remaining14:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore prior real JPG archive and 30-group queue
        run: |
          mkdir v2427b-source v2429b-source
          git fetch origin production-assets-v2427b-obge-shade-clean production-assets-v2429b-eight-family-qa
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C v2427b-source
          git archive origin/production-assets-v2429b-eight-family-qa | tar -xf - -C v2429b-source
      - name: Produce source-review JPGs for pending 17 to 30
        run: python scripts/v2429c_remaining14_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2429c-remaining14-real-photo-QA
          path: v2429c-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve isolated QA branch without public publication
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2429c-output /tmp/v2429c-qa
          git worktree add --detach /tmp/v2429c-wt HEAD
          cd /tmp/v2429c-wt
          git switch --orphan production-assets-v2429c-remaining14-qa
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2429c-qa/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve non-fabricated photo source QA for remaining fourteen pending groups'
          git push origin HEAD:refs/heads/production-assets-v2429c-remaining14-qa
