name: Shopee v2451 seven uncovered actual-source product detail JPGs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2451-seven-actual-products.yml'
      - 'scripts/v2451_seven_uncovered_real_photo_details.py'
permissions:
  contents: write
jobs:
  create-seven-source-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover the prior immutable 150 source-photo manifest and candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir prior-v2445b
          git fetch origin production-assets-v2445b-corrected-QA-hold-146
          git archive origin/production-assets-v2445b-corrected-QA-hold-146 | tar -xf - -C prior-v2445b
      - name: Make seven genuine-source image crops, check output properties
        run: python scripts/v2451_seven_uncovered_real_photo_details.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2451-seven-new-real-photo-detail-JPGs-no-sheets
          path: v2451-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve new seven drafts without modifying any prior image or published URL
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2451-output /tmp/v2451-artifact
          git worktree add --detach /tmp/v2451-wt HEAD
          cd /tmp/v2451-wt
          git switch --orphan production-assets-v2451-seven-new-photo-candidates
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2451-artifact/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve seven new real-photo product detail JPG candidates with accurate independent stock and rights holds'
          git push origin HEAD:refs/heads/production-assets-v2451-seven-new-photo-candidates
