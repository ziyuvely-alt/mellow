name: Plugin6 BBIA batch21 alternative official detail galleries
on:
  push:
    branches: [plugin6-source-smoketest-20261102]
    paths: ['.github/workflows/plugin6-bbia-batch21.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install Pillow requests beautifulsoup4
      - name: Collect shade and product detail images
        run: python3 scripts/plugin6_bbia_batch21.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin6-bbia-batch21-new-official-galleries
          path: plugin6-bbia-batch21-thai/
          if-no-files-found: warn
