name: BBIA v218 verify v217 actual candidate
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - .github/workflows/bbia-v218-refill-audit.yml
      - scripts/bbia_v218_refill_audit.py
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bbia-v217-official-refill-only-qa-pending
          run-id: 41824071042
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/bbia-v217-original
      - run: python -m pip install pillow==11.3.0
      - name: Read existing JPEG and make diagnostic-only QA preview
        run: python scripts/bbia_v218_refill_audit.py --input /tmp/bbia-v217-original --output /tmp/bbia-v218-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbia-v218-refill-diagnostic-only
          path: /tmp/bbia-v218-audit
          if-no-files-found: warn
          retention-days: 30
