name: Shopee v2726 MISSHA serum improved source-crop object alpha trial
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2726-missha-serum-crop-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Reframe actual source04 so product is no longer clipped, no previous files changed
        env:
          U2NET_HOME: /tmp/isnet-model-weights
        run: |
          python -m py_compile scripts/v2726_missha_serum_wider_photo_crop.py
          cp scripts/v2726_missha_serum_wider_photo_crop.py /tmp/v2726.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2726-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2726-qa
          test ! -e qa-review/v2726-missha-serum-30ml-true-single-bottle-cutout-QA
          python /tmp/v2726.py
          git add qa-review/v2726-missha-serum-30ml-true-single-bottle-cutout-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2726 retry only clipped serum hero with corrected wider source region, preserve old art'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
