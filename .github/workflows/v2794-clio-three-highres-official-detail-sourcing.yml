name: Shopee v2794 three CLIO blocked exact-item high-res detail photo discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2794-clio-three-highres-official-detail-sourcing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests beautifulsoup4
      - name: Source NEW original detail media, exclude prior v2793 low-res catalog thumbnails
        run: |
          python -m py_compile scripts/v2794_clio_highres_official_detail_source_batch.py
          python scripts/v2794_clio_highres_official_detail_source_batch.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2794-source qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2794-source/qa-review/v2794-clio-official-detail-original-photo-discovery
          cp -a qa-review/v2794-clio-official-detail-original-photo-discovery /tmp/v2794-source/qa-review/
          cd /tmp/v2794-source
          git add qa-review/v2794-clio-official-detail-original-photo-discovery
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2794 inspect three official CLIO product detail pages for high-res exact-item photos, no commercial publish'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
