name: Shopee v2587 four MISSHA DrG original product photos QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v2587_missha_drg_four_source_photo_candidates.py'
      - '.github/workflows/v2587-missha-drg-batch-photo.yml'
permissions:
  contents: read
  actions: read
jobs:
  four-product-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse existing original QA source without rebuilding any image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41753618979 -n shopee-v2560-six-candidate-156-JPG-isolated-review-corpus-no-XLSX -D v2587-original
      - name: Obtain four exact product source photos with independent similarity checks
        run: python scripts/v2587_missha_drg_four_source_photo_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2587-MISSHA-DrG-four-real-photo-QA-no-XLSX
          path: v2587-missha-drg-four-real-scene-QA/
          retention-days: 90
          if-no-files-found: error
