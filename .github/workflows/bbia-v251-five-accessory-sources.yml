name: BBIA v251 five accessory source audit
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v251_five_accessory_source_audit.py
      - .github/workflows/bbia-v251-five-accessory-sources.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v251_five_accessory_source_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v251-five-accessory-photo-sources
          path: /tmp/bbia-v251
