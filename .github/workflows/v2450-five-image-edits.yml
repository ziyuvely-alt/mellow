name: Shopee v2450 four real photo details and one generation-label correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2450-five-image-edits.yml'
      - 'scripts/v2450_four_photo_details_plus_one_label_fix.py'
permissions:
  contents: write
jobs:
  five-new-image-revisions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore original JPG images without editing historical public source
        shell: bash
        run: |
          mkdir prior-v2445b
          git fetch origin production-assets-v2445b-corrected-QA-hold-146
          git archive origin/production-assets-v2445b-corrected-QA-hold-146 | tar -xf - -C prior-v2445b
      - name: Render only five genuinely new edits and verify hashes
        run: python scripts/v2450_four_photo_details_plus_one_label_fix.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2450-5-new-customer-JPGs-no-spreadsheets
          path: v2450-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve isolated JPG-only branch without modifying originals
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2450-output /tmp/v2450-outputs
          git worktree add --detach /tmp/v2450-wt HEAD
          cd /tmp/v2450-wt
          git switch --orphan production-assets-v2450-five-fresh-customer-JPGs
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2450-outputs/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve 5 new true-photo and accurate-info customer JPG drafts, all rights and stock holds'
          git push origin HEAD:refs/heads/production-assets-v2450-five-fresh-customer-JPGs
