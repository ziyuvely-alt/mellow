name: Shopee cross-brand image source byte probe v247
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-source-bytes-v247.yml'
      - 'scripts/capture_source_bytes_v247.py'
      - 'evidence/source-first-16.json'
      - 'evidence/pending-30-v247.json'
permissions:
  contents: read
  statuses: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install requests Pillow
      - name: Download image candidates from cross-brand inventory
        run: python scripts/capture_source_bytes_v247.py
      - name: Preserve actual image bytes and CSV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-cross-brand-source-bytes-v247
          path: source-first-output-v247/
          if-no-files-found: warn
      - name: Expose actual source-byte result as GitHub commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'source-first-output-v247/capture_summary.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
            const downloaded = report?.downloaded_unapproved ?? 0;
            const total = report?.candidate_count ?? 0;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: downloaded > 0 ? 'success' : 'failure',
              context: 'shopee/source-byte-capture-v247',
              description: `Unapproved source bytes downloaded: ${downloaded}/${total}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
