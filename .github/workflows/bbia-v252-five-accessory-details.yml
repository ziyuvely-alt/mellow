name: BBIA v252 five accessory detail photo batch
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v252_five_accessory_details.py, .github/workflows/bbia-v252-five-accessory-details.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v252_five_accessory_details.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v252-five-original-photo-detail-jpg
          path: /tmp/bbia-v252
          retention-days: 30
