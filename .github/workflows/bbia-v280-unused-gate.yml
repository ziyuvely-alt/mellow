name: BBIA v280 three existing family unused source gate
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v280_unused_detail_gate.py, .github/workflows/bbia-v280-unused-gate.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v280_unused_detail_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v280-six-previously-unused-originals
          path: /tmp/bbia-v280
          retention-days: 30
