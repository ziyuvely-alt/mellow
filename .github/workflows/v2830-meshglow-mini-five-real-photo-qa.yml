name: Shopee v2830 curate five genuine exact Mesh Glow Essential Mini 5g QA photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2830-meshglow-mini-five-real-photo-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-photo-QA:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow only, do not recreate product imagery
        run: python -m pip install Pillow
      - name: Copy five distinct real photo sources with exact byte and license holds
        run: |
          python -m py_compile scripts/v2830_clio_meshglow_five_real_photo_QA.py
          cp scripts/v2830_clio_meshglow_five_real_photo_QA.py /tmp/v2830.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2830-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2830-qa
          test ! -e qa-review/v2830-clio-meshglow-essential-mini5g-five-distinct-physical-photo-QA
          python /tmp/v2830.py
          git add qa-review/v2830-clio-meshglow-essential-mini5g-five-distinct-physical-photo-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2830 stage 5 distinct exact mesh glow mini5g real-photo QA source frames, rights holds'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
