name: Shopee v2757 no-rebuild QA verify all twenty preserved Peripera cutouts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2757-all20-peripera-existing-cutout-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse 20 prior real PNG and JPG images exactly; validate transparency and edition identity
        run: |
          cp scripts/v2757_peripera_all20_existing_photo_qa.py /tmp/v2757.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2757 qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2757
          python /tmp/v2757.py
          git add qa-review/v2757-peripera-all20-existing-cutout-file-and-edition-audit
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2757 all 20 legacy Peripera JPG PNG true-alpha physical QA and exact Peritage edition guards; no image recreation'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
