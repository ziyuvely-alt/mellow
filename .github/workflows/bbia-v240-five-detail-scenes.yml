name: BBIA v240 five genuine distinct detail scenes
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v240_five_detail_scenes.py, .github/workflows/bbia-v240-five-detail-scenes.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - name: Produce five new product-photo-only detail scenes
        run: python scripts/bbia_v240_five_detail_scenes.py --out /tmp/bbia-v240
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v240-five-new-source-photo-detail-jpg-qa
          path: /tmp/bbia-v240
          retention-days: 30
