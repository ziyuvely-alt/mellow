name: v2981 MISSHA CLIO five-frame virtual product-first QA
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2981-two-family-five-frame-source-rosters.yml'
      - 'scripts/v2981_two_product_family_five_slot_source_sha_roster.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-real-JPGs-and-stage-two-rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Verify 10 JPG sources and record 2 complete five-frame internal QA storyboards, no other images
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2981-two-product-family-5slot-byteverified-storyboards-20261106
          python scripts/v2981_two_product_family_five_slot_source_sha_roster.py
          git add qa-review/v2981-two-product-family-5slot-byteverified-storyboards-20261106
          git diff --cached --name-only | tee /tmp/v2981-appendonly
          ! grep -Ev '^qa-review/v2981-two-product-family-5slot-byteverified-storyboards-20261106/.*\.json$' /tmp/v2981-appendonly
          git commit -m "QA v2981: ten existing JPG SHA-verified, two five-slot source rosters, sale rights held"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
