name: Shopee v2755 only Peripera 12 alternate source true alpha
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2755-peripera12-alternate-photographic-cutout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shade12:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests 'rembg[cpu]==2.0.67'
      - name: Alternative exact shade12 photo only, first broken CDN not retried
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          python scripts/v2755_peripera12_alt_source_true_alpha.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2755 qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2755/qa-review/v2755-only-peripera-12-legacy-alternate-bottle-photo
          cp -a qa-review/v2755-only-peripera-12-legacy-alternate-bottle-photo /tmp/v2755/qa-review/
          cd /tmp/v2755
          git add qa-review/v2755-only-peripera-12-legacy-alternate-bottle-photo
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2755 exact old Peritage 12 alternate image and actual alpha, keep 13/14 plus 17 previous intact'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
