name: Shopee v2432 Goodal actual photo retailer badge removal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2432-goodal-photo.yml'
      - 'scripts/v2432_goodal_remove_retailer_badge.py'
permissions:
  contents: write
jobs:
  real-goodal-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore immutable source JPG
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Crop badged source photograph and compose actual customer JPG draft
        run: python scripts/v2432_goodal_remove_retailer_badge.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2432-goodal-100ml-real-photo-no-retailer-badge
          path: v2432-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve draft separately without publication
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2432-output /tmp/v2432-saved
          git worktree add --detach /tmp/v2432-wt HEAD
          cd /tmp/v2432-wt
          git switch --orphan production-assets-v2432-goodal-real-photo-clean
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2432-saved/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Store v2432 real Goodal photograph without retailer badge; no sale release'
          git push origin HEAD:refs/heads/production-assets-v2432-goodal-real-photo-clean
