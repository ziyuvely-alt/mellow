name: Shopee v2743 precise OBGE finisher 5g real-photo compact matte
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2743-OBGE-5g-manual-true-object-contour.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  matte:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Clip genuine manufacturer compact, excluding white cosmetic swatch and old fake brand badge
        run: |
          cp scripts/v2743_obge_native_5g_precision_shape_matte.py /tmp/v2743.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2743-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2743-qa
          python /tmp/v2743.py
          git add qa-review/v2743-obge-finisher-official-5g-only-precision-contour-matte
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2743 actual source photo compact only alpha shape, no surrounding smear or approved image mutation'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
