name: Shopee v2519 Pixelpure toner one genuinely new 200ml hand-held photo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2519-toner-fifth-photo.yml'
      - 'scripts/v2519_pixelpure_toner_fifth_exact_real_photo.py'
permissions:
  actions: read
  contents: write
jobs:
  preserve-one:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover old official source artifact without rediscovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41682843250 -n shopee-v2465-pixelpure-toner-official-photo-QA-HOLD -D v2465-official-sources
      - name: Render only fifth real product photo, with promotional claim header cropped away
        run: |
          python scripts/v2519_pixelpure_toner_fifth_exact_real_photo.py
          test -s v2519-pixelpure-toner-fifth-real-photo/05-real-bottle-held-over-water-200ml.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2519-pixelpure-toner-real-handheld-photo-fifth-JPG
          path: v2519-pixelpure-toner-fifth-real-photo/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve isolated QA JPG without changing published URLs
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2519-pixelpure-toner-fifth-real-photo /tmp/v2519-jpg
          git worktree add --detach /tmp/v2519-wt HEAD
          cd /tmp/v2519-wt
          git switch --orphan production-assets-v2519-pixelpure-toner-fifth-photo
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2519-jpg/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve distinct genuine Pixelpure 200mL toner held-over-water photo for fifth frame QA'
          git push origin HEAD:refs/heads/production-assets-v2519-pixelpure-toner-fifth-photo
