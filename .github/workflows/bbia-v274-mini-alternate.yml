name: BBIA v274 alternate mini detail audit
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v274_mini_alternate_details.py, .github/workflows/bbia-v274-mini-alternate.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v274_mini_alternate_details.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v274-alternate-mini-source-photos
          path: /tmp/bbia-v274
          retention-days: 30
