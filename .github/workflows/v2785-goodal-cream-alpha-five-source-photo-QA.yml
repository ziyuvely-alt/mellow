name: Shopee v2785 GOODAL Cream Alpha five visual photo-frame QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2785-goodal-cream-alpha-five-source-photo-QA.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install Pillow
      - name: Reuse three saved brand photos and one earlier cutout, crop only real product pixels
        run: |
          cp scripts/v2785_goodal_cream_alpha_five_photographic_frame_QA.py /tmp/v2785.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2785-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2785-qa
          python /tmp/v2785.py
          git add qa-review/v2785-goodal-cream-alpha-fiveframe-photo-first-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2785 stage five honest visual GOODAL cream frames from four authentic source photo exposures, no retail approval'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
