name: v2977 OBgE Oil Finisher 5g original usage image, no portraits
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2977-obge-finisher-original-howto-no-portrait.yml'
      - 'scripts/v2977_obge_finisher5g_replace_skin_model_with_original_guide.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  one-original-QA-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Build unique claim-free product instruction graphic with no copyrighted image or forged MK
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2977-obge-finisher5g-one-original-directions-frame-20261106
          python scripts/v2977_obge_finisher5g_replace_skin_model_with_original_guide.py
          git add qa-review/v2977-obge-finisher5g-one-original-directions-frame-20261106
          git diff --cached --name-only | tee /tmp/v2977-paths
          ! grep -Ev '^qa-review/v2977-obge-finisher5g-one-original-directions-frame-20261106/' /tmp/v2977-paths
          git commit -m "QA v2977 append one original OBgE Oil Control Finisher usage frame; rights logo and stock pending"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
