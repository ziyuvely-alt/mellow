name: Shopee v2865 MISSHA serum30 dropper residual local true-alpha QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2865-missha-serum30-dropper-cap-fringe-local-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  residual_without_older_regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Trim source-alpha only from immutable v2855 PNG; save cap closeup and 1080 QA
        run: |
          cp scripts/v2865_missha_30ml_dropper_red_fringe_local_alpha_QA.py /tmp/v2865.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2865qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2865qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2865.py
          git add qa-review/v2865-missha30-dropper-right-red-fringe-isolated-local-QA
          git commit -m 'v2865 QA only MISSHA dropper exact RGB local alpha trim and 4x native edge proof'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
