name: Shopee v2868 21C21N real source swatch crops plus 30 family resume snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2868-founwear-real-swatch-two-source-crops-and-stock30-state.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_provenance_and_queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Create four genuine source-swatch crop QA cards and non-destructive 30-family resume state
        run: |
          cp scripts/v2868_founwear_21C21N_two_photo_source_crops_QA_and_queue.py /tmp/v2868.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2868qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2868qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2868.py
          git add qa-review/v2868-founwear-21C21N-two-real-source-crops-and-stock30-resume
          git commit -m 'v2868 stage 4 labeled merchant source swatch crops for 21C21N and preserve 30-family actionable queue'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
