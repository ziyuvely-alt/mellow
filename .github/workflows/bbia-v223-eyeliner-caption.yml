name: BBIA v223 targeted residual Korean removal
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v223_eyeliner_caption_full_cleanup.py
      - .github/workflows/bbia-v223-eyeliner-caption.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bbia-v222-eyeliner-03-targeted-caption-qa-pending
          run-id: 41827460390
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/bbia-v222
      - run: python -m pip install pillow==11.3.0
      - name: Remove residual embedded Korean only
        run: python scripts/bbia_v223_eyeliner_caption_full_cleanup.py --src /tmp/bbia-v222 --out /tmp/bbia-v223
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v223-eyeliner-03-full-caption-clean-qa-pending
          path: /tmp/bbia-v223
          retention-days: 30
