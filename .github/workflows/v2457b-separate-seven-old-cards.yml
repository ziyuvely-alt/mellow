name: Shopee v2457b separate 7 visually redundant old cards, retain 79 actual JPGs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2457b-separate-seven-old-cards.yml'
      - 'scripts/v2457b_separate_seven_redundant_source_cards.py'
permissions:
  contents: write
jobs:
  separate-redundant-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore 86 previous source JPG and their SHA manifests, never rerender
        shell: bash
        run: |
          set -euo pipefail
          mkdir prior-v2446b prior-v2457
          git fetch origin production-assets-v2446b-logo-64-quarantine-86-hold production-assets-v2457-86-source-image-qa
          git archive origin/production-assets-v2446b-logo-64-quarantine-86-hold | tar -xf - -C prior-v2446b
          git archive origin/production-assets-v2457-86-source-image-qa | tar -xf - -C prior-v2457
      - name: Split only 7 confirmed duplicate/older frames, keep 79 unchanged
        run: python scripts/v2457b_separate_seven_redundant_source_cards.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2457b-79-retained-7-redundant-quarantined
          path: v2457b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve latest exact JPG checkpoint as independent branch, no spreadsheet
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2457b-output /tmp/v2457b-results
          git worktree add --detach /tmp/v2457b-wt HEAD
          cd /tmp/v2457b-wt
          git switch --orphan production-assets-v2457b-79-retained-seven-quarantine
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2457b-results/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save 79 source candidate JPGs, quarantine 7 confirmed visually redundant cards, no commercial approvals'
          git push origin HEAD:refs/heads/production-assets-v2457b-79-retained-seven-quarantine
