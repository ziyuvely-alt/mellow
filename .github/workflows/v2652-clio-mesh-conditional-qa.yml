name: Shopee v2652 CLIO Mesh pair conditional photo-delta QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v2652_clio_mesh_conditional_photo_qa.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  batch-two:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Fetch preserved historical actual photos once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41764831639 -n shopee-v2593-definitive-156-physical-JPG-17delta-review-corpus-no-XLSX -D source/photos
      - name: Analyze two CLIO families, produce detail crops only on similarity
        run: python scripts/v2652_clio_mesh_conditional_photo_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2652-two-clio-mesh-conditional-QA-no-XLSX
          path: v2652-clio-other-two-diagnostic/
          retention-days: 90
          if-no-files-found: error
