name: Shopee v2922 five historical stock families 25 byte-identical JPG internal ZIP QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2922-five-historical-25photo-QAzip.yml'
      - 'scripts/v2922_five_historic_stock_families_immutable_25_jpg_QA_ZIPs.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive_only_five_historic_stock_products:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse and SHA-check historical 25 JPG originals, write only new internal QA ZIP path
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2922_five_historic_stock_families_immutable_25_jpg_QA_ZIPs.py
          cp scripts/v2922_five_historic_stock_families_immutable_25_jpg_QA_ZIPs.py /tmp/v2922.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2922qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2922qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2922-five-legacy-stock-family-original-25photo-internal-only-archive-ZIP
          python /tmp/v2922.py
          git add qa-review/v2922-five-legacy-stock-family-original-25photo-internal-only-archive-ZIP
          git diff --cached --name-only | tee /tmp/v2922-changed
          ! grep -Ev '^qa-review/v2922-five-legacy-stock-family-original-25photo-internal-only-archive-ZIP/' /tmp/v2922-changed
          git commit -m 'v2922 archive 25 original JPG source bytes in 5 QA-only ZIPs, old files immutable'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
