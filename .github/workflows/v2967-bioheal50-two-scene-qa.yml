name: v2967 BIOHEAL BOH two 50mL unique reference scenes
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2967-bioheal50-two-scene-qa.yml'
      - 'scripts/v2967_bioheal_50ml_alternate_scene_rights_hold.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Test only two new refs; compare originals, never overwrite or publish
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2967-bioheal-cream50-two-distinct-alternative-scenes-20261106
          python scripts/v2967_bioheal_50ml_alternate_scene_rights_hold.py
          git add qa-review/v2967-bioheal-cream50-two-distinct-alternative-scenes-20261106
          git diff --cached --name-only | tee /tmp/v2967-only
          ! grep -Ev '^qa-review/v2967-bioheal-cream50-two-distinct-alternative-scenes-20261106/' /tmp/v2967-only
          git commit -m "QA v2967: preserve two different Bioheal 50mL external references as private internal QA"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
