name: Shopee v2527 MISSHA Moist Up true 21 and 23 shade source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2527-missha-moistup-source.yml'
      - 'scripts/v2527_missha_moistup_21_23_real_source.py'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Stage 21 and 23 actual brand product photographs for QA only
        run: python scripts/v2527_missha_moistup_21_23_real_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2527-MISSHA-MoistUp-21-23-actual-shade-photo-sources
          path: v2527-missha-moistup-21-23-original-source/
          retention-days: 90
          if-no-files-found: error
