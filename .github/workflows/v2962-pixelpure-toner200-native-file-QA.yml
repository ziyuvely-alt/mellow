name: v2962 PIXELPURE toner200 native-source not thumbnail
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2962-pixelpure-toner200-native-file-QA.yml'
      - 'scripts/v2962_pixelpure_toner200_raw_bubble_original_candidate.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  one-raw-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Single raw photo attempt, preserve all prior QA and published
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2962-pixelpure-toner200-distinct-multibottle-scene-20261106
          python scripts/v2962_pixelpure_toner200_raw_bubble_original_candidate.py
          git add qa-review/v2962-pixelpure-toner200-distinct-multibottle-scene-20261106
          git diff --cached --name-only | tee /tmp/v2962-changed
          ! grep -Ev '^qa-review/v2962-pixelpure-toner200-distinct-multibottle-scene-20261106/' /tmp/v2962-changed
          git commit -m "QA v2962: one native Pixelpure toner photo candidate, no customer sale approval"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
