name: Shopee v2742 precise original OBGE 5g product-only alpha source masks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2742-real-native-finisher-product-only-masks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  precise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless
      - name: Segment only actual original 5g compact, exclude white cream and promotional cards
        run: |
          cp scripts/v2742_obge_real_photo_two_contour_models.py /tmp/v2742.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2742-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2742-qa
          python /tmp/v2742.py
          git add qa-review/v2742-obge-5g-source997-compact-alpha-extraction
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2742 from same true firstparty 997px compact create precise color and GrabCut alpha QA'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
