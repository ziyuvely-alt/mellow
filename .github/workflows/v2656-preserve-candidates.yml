name: Shopee v2656 package 14 existing QA JPGs into immutable review bundle
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v2656_preserve_14_qa_candidates.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore v2651 isolated original JPG candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41823617648 -n shopee-v2651-clio-pending05-actual-photo-detail-candidate-QA-no-XLSX -D source/a
      - name: Restore v2652 isolated original JPG candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41823767454 -n shopee-v2652-two-clio-mesh-conditional-QA-no-XLSX -D source/b
      - name: Restore v2653 already produced 12 candidate JPGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41824399357 -n shopee-v2653-27-family-no-repeat-visual-qa-no-XLSX -D source/c
      - name: Restore v2655 cross SKU collision audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41825126540 -n shopee-v2655-14candidate-crossSKU-identify-QA-only-no-XLSX -D source/v2655
      - name: Copy only original 14 QA JPEG bytes, verifying exact hashes
        run: python scripts/v2656_preserve_14_qa_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2656-immutable-14-real-photo-QA-JPG-with-hash-manifest-no-XLSX
          path: v2656-preserved-14-QA-candidates/
          retention-days: 90
          if-no-files-found: error
