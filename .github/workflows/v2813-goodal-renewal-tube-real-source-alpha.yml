name: Shopee v2813 correct GOODAL 25AD renewal tube real alpha from new source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2813-goodal-renewal-tube-real-source-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless requests 'rembg[cpu]==2.0.67'
      - name: Save real renewal tube references and mask genuine standalone yellow tube, not old pump
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2813_goodal_25ad_renewal_tube_real_alpha.py /tmp/v2813.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2813-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2813-qa/qa-review/v2813-goodal-renewal-25AD-tube-genuine-source-alpha
          cd /tmp/v2813-qa
          python /tmp/v2813.py
          git add qa-review/v2813-goodal-renewal-25AD-tube-genuine-source-alpha
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2813 genuine 2026 GOODAL 25AD silver cap tube source and actual alpha; old pumps excluded'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
