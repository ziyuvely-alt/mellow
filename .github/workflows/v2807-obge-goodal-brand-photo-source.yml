name: Shopee v2807 first party OBgE 5g and GOODAL eye cream authentic source photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2807-obge-goodal-brand-photo-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests beautifulsoup4
      - name: Preserve genuine firstparty source images for two previously failed items
        run: |
          python scripts/v2807_two_firstparty_unclipped_product_sources.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2807-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2807-qa/qa-review/v2807-two-official-single-item-product-photo-discovery
          cp -a qa-review/v2807-two-official-single-item-product-photo-discovery /tmp/v2807-qa/qa-review/
          cd /tmp/v2807-qa
          git add qa-review/v2807-two-official-single-item-product-photo-discovery
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2807 official first-party actual single product JPG candidates for OBgE and GOODAL eye cream; retail HOLD'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
