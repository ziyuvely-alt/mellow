name: BBIA v226 correct eyeliner frame 04 06 shade captions
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v226_shade_caption_fix.py
      - .github/workflows/bbia-v226-shade-captions.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - name: Create two corrected isolated QA JPEGs
        run: python scripts/bbia_v226_shade_caption_fix.py --out /tmp/bbia-v226
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v226-two-corrected-shade-caption-jpg-qa-pending
          path: /tmp/bbia-v226
          retention-days: 30
