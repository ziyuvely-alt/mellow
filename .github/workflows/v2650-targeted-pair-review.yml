name: Shopee v2650 targeted duplicate pair contact-sheet QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v2650_review_single_similarity_pair.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focused-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse existing v2649 audit without rescanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41822057414 -n shopee-v2649-historical-156-photo-cross-family-audit-no-images-no-XLSX -D source/audit
      - name: Reuse existing preserved source photos without regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41764831639 -n shopee-v2593-definitive-156-physical-JPG-17delta-review-corpus-no-XLSX -D source/photos
      - name: Build only the flagged pair side-by-side review
        run: python scripts/v2650_review_single_similarity_pair.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2650-one-flagged-pair-review-only-no-XLSX
          path: v2650-review/
          retention-days: 90
          if-no-files-found: error
