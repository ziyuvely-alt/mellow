name: Shopee v2481 DrG Brightening Sun Plus 50mL exact source acquisition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2481-drg-brightening-sun-sources.yml'
      - 'scripts/v2481_drg_brightening_sunplus_sources.py'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/v2481_drg_brightening_sunplus_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2481-drG-brightening-sun50-authentic-photo-qa-hold
          path: v2481-drg-brightening-up-sun-50-source/
          retention-days: 90
          if-no-files-found: error
