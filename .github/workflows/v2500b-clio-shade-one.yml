name: Shopee v2500b CLIO mini single shade-card visual repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2500b-clio-shade-one.yml'
      - 'scripts/v2500b_clio_single_shade_card_visual_repair.py'
permissions:
  actions: read
  contents: write
jobs:
  precise-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Reuse approved original wording card for targeted single-image repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41691203770 -n shopee-v2499-clio-mini-2-non-swatch-factual-JPG-QA-HOLD -D v2499-source
      - run: python scripts/v2500b_clio_single_shade_card_visual_repair.py
      - run: test -s v2500b-clio-single-shade-correction/04-mini-shades-factual-corrected.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2500b-clio-single-shade-fact-card-corrected
          path: v2500b-clio-single-shade-correction/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve as isolated draft only
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2500b-clio-single-shade-correction /tmp/v2500b-out
          git worktree add --detach /tmp/v2500b-wt HEAD
          cd /tmp/v2500b-wt
          git switch --orphan production-assets-v2500b-clio-single-shade-corrected
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2500b-out/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve corrected CLIO mini 3-shade label card, no fake swatches'
          git push origin HEAD:refs/heads/production-assets-v2500b-clio-single-shade-corrected
