name: BBIA v248 next eight families source triage
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v248_eight_fresh_family_sources.py
      - .github/workflows/bbia-v248-eight-sources.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v248_eight_fresh_family_sources.py --out /tmp/bbia-v248
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v248-eight-family-source-batch
          path: /tmp/bbia-v248
          retention-days: 30
