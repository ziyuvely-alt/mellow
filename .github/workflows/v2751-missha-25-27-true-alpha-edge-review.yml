name: Shopee v2751 no-regeneration official shade 25 27 alpha-edge evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2751-missha-25-27-true-alpha-edge-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Inspect saved shade-specific alpha and selected JPG bytes without rerender
        run: |
          cp scripts/v2751_missha_25_27_saved_alpha_edge_QA.py /tmp/v2751.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2751-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2751-qa
          python /tmp/v2751.py
          git add qa-review/v2751-missha-shades25-27-true-alpha-edge-qa
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2751 independent shade25/27 already produced alpha and true pixels edge QA, no rerender'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
