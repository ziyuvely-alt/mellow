name: Shopee v2864 CLIO Founwear U2Net white lid/puff alpha QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2864-clio-founwear-u2net-white-lid-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified_white_material:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy 'rembg[cpu]==2.0.67'
      - name: One U2Net pass on archived original RGB; white lid and puff mask QA with hard holds
        env:
          U2NET_HOME: /tmp/u2net-originals
        run: |
          python -m py_compile scripts/v2864_clio_founwear_u2net_original_rgb_recovery_QA.py
          cp scripts/v2864_clio_founwear_u2net_original_rgb_recovery_QA.py /tmp/v2864.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2864qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2864qa
          test ! -e qa-review/v2864-founwear-3-white-lid-u2net-native-RGB-check
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2864.py
          git add qa-review/v2864-founwear-3-white-lid-u2net-native-RGB-check
          git commit -m 'v2864 archive U2Net alternative CLIO Founwear 3 source masks with white lid/puff QA gates'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
