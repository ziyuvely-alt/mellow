name: Shopee v2896b correct MISSHA official 30ml source image archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2896b-missha30-fix-original-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve_brand_original_and_qa_reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive exact official clean native product source and sale-held QA JPG
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2896_missha30_brand_clean_source_recovery.py
          cp scripts/v2896_missha30_brand_clean_source_recovery.py /tmp/v2896b.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2896bqa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2896bqa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2896-missha30-brand-official-clean-single-bottle-source
          python /tmp/v2896b.py
          git add qa-review/v2896-missha30-brand-official-clean-single-bottle-source
          git commit -m 'v2896b preserve first party clean 30mL bottle source and 30-family QA resume state'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
