name: BBIA v254 four fresh families source gate
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - scripts/bbia_v254_four_fresh_source_gate.py
      - .github/workflows/bbia-v254-source-gate.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v254_four_fresh_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v254-source-contact-4-family-12-photos
          path: /tmp/bbia-v254
          retention-days: 30
