name: Shopee v2518 consolidate 149 QA JPG across 30 families selectively
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2518-30family-consolidate.yml'
      - 'scripts/v2518_selectively_consolidate_30_family_jpgs.py'
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Fetch old 146 customer JPGs and only corrected isolated JPG branches
        shell: bash
        run: |
          set -euo pipefail
          for b in production-assets-v2444-reviewed-146-and-quarantine-4 production-assets-v2511-obge-homme-15g-corrected production-assets-v2513-missha-bb-legible production-assets-v2500b-clio-single-shade-corrected production-assets-v2515-drg-brightening-one production-assets-v2466-pixelpure-toner-three; do
            git fetch origin "$b:refs/remotes/origin/$b"
          done
          git worktree add --detach /tmp/v2518-baseline origin/production-assets-v2444-reviewed-146-and-quarantine-4
      - name: Compose 149 candidate JPG from existing bytes and check 1080 / 2MB / SHA
        run: python scripts/v2518_selectively_consolidate_30_family_jpgs.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2518-30family-149-actual-JPG-consolidated-QA-not-final
          path: v2518-30family-selective-consolidation/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve untouched 55 public URLs, archive only into isolated QA branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2518-30family-selective-consolidation /tmp/v2518-output
          git worktree add --detach /tmp/v2518-wt HEAD
          cd /tmp/v2518-wt
          git switch --orphan production-assets-v2518-149-recovered-30family-qa
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2518-output/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve QA-only 149 genuine customer JPG candidates across 30 pending families'
          git push origin HEAD:refs/heads/production-assets-v2518-149-recovered-30family-qa
