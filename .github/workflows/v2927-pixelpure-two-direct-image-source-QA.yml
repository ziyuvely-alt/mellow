name: Shopee v2927 two PixelPure direct official original-photo checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2927-pixelpure-two-direct-image-source-QA.yml'
      - 'scripts/v2927_pixelpure_two_direct_official_images_dedupe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate_unseen_source_photos_without_old_image_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - name: Check 2 candidate manufacturer photos against prior 3 source JPGs each and save only new QA records
        run: |
          set -euo pipefail
          python -m py_compile scripts/v2927_pixelpure_two_direct_official_images_dedupe.py
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('scripts/v2927_pixelpure_two_direct_official_images_dedupe.py').read_text()
          assert not re.search(r',font\(\d+\),fill=',s), 'Pillow ImageDraw must use keyword font'
          assert 'v2926' in s and 'sale_approved' in s
          print('v2927 syntax and Pillow font preflight passed')
          PY
          cp scripts/v2927_pixelpure_two_direct_official_images_dedupe.py /tmp/v2927.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2927qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2927qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          test ! -e qa-review/v2927-pixelpure-two-direct-official-source-originals-dedupe-QA
          python /tmp/v2927.py
          git add qa-review/v2927-pixelpure-two-direct-official-source-originals-dedupe-QA
          git diff --cached --name-only | tee /tmp/v2927-changed
          ! grep -Ev '^qa-review/v2927-pixelpure-two-direct-official-source-originals-dedupe-QA/' /tmp/v2927-changed
          git commit -m 'v2927 inspect two exact PixelPure product image references, retain only unseen original scenes'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
