name: Shopee v2857 OBgE official beige original-photo GrabCut fallback QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2857-obge300-beige-original-fallback-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean_official_original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless
      - name: Use archived official beige product photo, never prior clipping geometry
        run: |
          cp scripts/v2857_obge300ml_official_beige_grabcut_qa.py /tmp/v2857.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2857qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2857qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2857.py
          git add qa-review/v2857-obge300ml-official-beige-source-true-alpha-recovery-QA
          git commit -m 'v2857 OBgE 300mL new clean official source candidate QA, failed previous mask on HOLD'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
