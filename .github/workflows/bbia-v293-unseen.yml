name: BBIA v293 eight unseen photo source gate
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v293_eight_unseen_sources.py, .github/workflows/bbia-v293-unseen.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v293_eight_unseen_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v293-eight-original-photos-and-contact
          path: /tmp/bbia-v293
          retention-days: 30
