name: Shopee v2479 source BIOHEAL BOH NAD Boost Cream 50ml
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2479-bioheal-nad-cream.yml'
      - 'scripts/v2479_bioheal_nad_boost_cream_sources.py'
permissions:
  contents: read
jobs:
  source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Collect source photographs for the exact 50ml stock item only
        run: python scripts/v2479_bioheal_nad_boost_cream_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2479-bioheal-boost-cream-source-QA-HOLD
          path: v2479-bioheal-boost-cream-sources/
          retention-days: 90
          if-no-files-found: error
