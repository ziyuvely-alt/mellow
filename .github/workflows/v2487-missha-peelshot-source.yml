name: Shopee v2487 MISSHA PDRN Renew Peel Shot 25 15ml genuine-photo acquisition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2487-missha-peelshot-source.yml'
      - 'scripts/v2487_missha_peelshot_15ml_official_source.py'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/v2487_missha_peelshot_15ml_official_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2487-MISSHA-PDRN-PeelShot15ml-actual-photo-reference
          path: v2487-missha-pdrn-peelshot-15-official-evidence/
          retention-days: 90
          if-no-files-found: error
