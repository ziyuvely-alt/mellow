name: BBIA v229 bulk real-photo draft production
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths:
      - .github/workflows/bbia-v229-bulk-production.yml
      - scripts/bbia_v229_bulk_photo_production.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - name: Bulk source and produce only authenticated adequate-resolution image candidates
        run: python scripts/bbia_v229_bulk_photo_production.py --out /tmp/bbia-v229
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbia-v229-bulk-photo-new-candidates-and-holds
          path: /tmp/bbia-v229
          retention-days: 30
          if-no-files-found: error
