name: Collect additional authentic OBgE and BIOHEAL original photos v241
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v241_collect_next_two.py'
      - '.github/workflows/v241-collect-next-two.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 Pillow
      - run: python scripts/v241_collect_next_two.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v241-next-two-source-candidates
          path: v241_next_two_sources/
          if-no-files-found: warn
