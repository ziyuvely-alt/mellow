name: Shopee v2464 compose OBgE finisher missing three exact-photo frames
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2464-obge-finisher-three.yml'
      - 'scripts/v2464_obge_finish_three_from_recovered_sources.py'
permissions:
  actions: read
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover unchanged genuine photo originals from previous successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41682388609 -n shopee-v2463-obge-real-photo-angles-NOT-PUBLISHED -D v2463-obge-oil-control-real-photo
      - name: Create only missing frames 03-05 as independent JPEGs
        run: python scripts/v2464_obge_finish_three_from_recovered_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2464-obge-finisher-3-new-photo-backed-JPG-QA-HOLD
          path: v2464-pending09-three-real-photo-frames/
          retention-days: 90
          if-no-files-found: error
      - name: Save only unapproved drafts to isolated preservation branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2464-pending09-three-real-photo-frames /tmp/v2464-jpg-drafts
          git worktree add --detach /tmp/v2464-wt HEAD
          cd /tmp/v2464-wt
          git switch --orphan production-assets-v2464-obge-finisher-new-three
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2464-jpg-drafts/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve three genuinely photo-backed OBgE Finisher draft JPGs for brand license and logo QA'
          git push origin HEAD:refs/heads/production-assets-v2464-obge-finisher-new-three
