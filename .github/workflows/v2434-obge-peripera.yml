name: Shopee v2434 OBgE Peripera actual JPG partial revisions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2434-obge-peripera.yml'
      - 'scripts/v2434_obge_peripera_actual_edits.py'
permissions:
  contents: write
jobs:
  actual-edits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore immutable actual original JPGs
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Create actual customer JPG candidate revisions
        run: python scripts/v2434_obge_peripera_actual_edits.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2434-OBGE-Peripera-three-actual-JPG-drafts
          path: v2434-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve separate new immutable branch without publishing
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2434-output /tmp/v2434-saved
          git worktree add --detach /tmp/v2434-wt HEAD
          cd /tmp/v2434-wt
          git switch --orphan production-assets-v2434-obge-peripera-drafts
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2434-saved/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve three actual photo and text customer JPG drafts; no sales approval'
          git push origin HEAD:refs/heads/production-assets-v2434-obge-peripera-drafts
