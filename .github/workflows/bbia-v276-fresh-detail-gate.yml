name: BBIA v276 three-family fresh detail roles gate
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v276_fresh_detail_sources.py, .github/workflows/bbia-v276-fresh-detail-gate.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v276_fresh_detail_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v276-nine-unreviewed-product-detail-originals
          path: /tmp/bbia-v276
          retention-days: 30
