name: Shopee v2675 two MISSHA photo-first five-JPG set production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2675-missha-two-fiveframe.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover historical JPEGs without changing any photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41764831639 -n shopee-v2593-definitive-156-physical-JPG-17delta-review-corpus-no-XLSX -D historical
      - name: Build both pending-family five-JPG sets without repeating past completed families
        run: |
          python scripts/v2675_missha_two_fiveframe.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2675-qa qa-assets/v2662-immutable-14-candidates
          test ! -e /tmp/v2675-qa/qa-review/v2675-missha-two-five-frame-photo-sets
          cp -a qa-review/v2675-missha-two-five-frame-photo-sets /tmp/v2675-qa/qa-review/
          cd /tmp/v2675-qa
          git add qa-review/v2675-missha-two-five-frame-photo-sets
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2675 two MISSHA five-JPG QA product sets, 8 originals preserved and 2 safe info repairs'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
