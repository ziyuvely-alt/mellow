name: Shopee v2442b assemble thirty real family image candidate sets without rerender
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2442b-assemble-30-family-sets.yml'
      - 'scripts/v2442b_safety_filter_30family_sets.py'
permissions:
  contents: write
jobs:
  thirty-actual-source-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover prior source and already edited JPGs; no regeneration
        shell: bash
        run: |
          set -euo pipefail
          mkdir baseline-v2427b prior-v2440e prior-v2441c prior-v2431b prior-v2435
          git fetch origin production-assets-v2427b-obge-shade-clean production-assets-v2440e-12-drafts-consolidated production-assets-v2441c-five-new-drafts production-assets-v2431b-200ml-layout-clean production-assets-v2435-peripera-caption-corrected
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
          git archive origin/production-assets-v2440e-12-drafts-consolidated | tar -xf - -C prior-v2440e
          git archive origin/production-assets-v2441c-five-new-drafts | tar -xf - -C prior-v2441c
          git archive origin/production-assets-v2431b-200ml-layout-clean | tar -xf - -C prior-v2431b
          git archive origin/production-assets-v2435-peripera-caption-corrected | tar -xf - -C prior-v2435
      - name: Copy and SHA-verify 30 family candidate sets, generate package
        run: python scripts/v2442b_safety_filter_30family_sets.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2442b-30group-actual-JPG-candidate-sets
          path: v2442b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve versioned candidate JPG sets without public URL mutation
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2442b-output /tmp/v2442b-preserved
          git worktree add --detach /tmp/v2442b-wt HEAD
          cd /tmp/v2442b-wt
          git switch --orphan production-assets-v2442b-thirty-safety-filtered-sets
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2442b-preserved/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve actual source image review candidates for thirty product groups; no sale approval'
          git push origin HEAD:refs/heads/production-assets-v2442b-thirty-safety-filtered-sets
