name: BBIA v268 two verified mini original recovery
on:
  push:
    branches: [bbia-ch2-qa-20261104]
    paths: [scripts/bbia_v268_two_mini_originals.py, .github/workflows/bbia-v268-two-mini-originals.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/bbia_v268_two_mini_originals.py
      - uses: actions/upload-artifact@v4
        with:
          name: bbia-v268-two-mini-original-detail-sources
          path: /tmp/bbia-v268
          retention-days: 30
