name: Shopee v2420 public-first 55 English language QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2420-en-master.yml'
      - 'scripts/v2420_public_55_audit.py'
      - 'scripts/v2420_en_master_revise.py'
permissions:
  contents: write
  actions: read
jobs:
  public-first:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow requests
      - name: Download and audit candidate 55 published JPG without modification
        run: python scripts/v2420_public_55_audit.py
      - name: Save public source bytes and comparison contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-v2420-public-55-inventory
          path: production-v2420-public-audit/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve no-release public audit on version branch
        if: success()
        run: |
          cp -a production-v2420-public-audit /tmp/v2420-public-audit
          git worktree add --detach /tmp/v2420-public-wt HEAD
          cd /tmp/v2420-public-wt
          git switch --orphan production-assets-v2420-public-language-audit
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2420-public-audit/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve v2420 public language audit and original 55 JPEG proof"
          git push origin HEAD:refs/heads/production-assets-v2420-public-language-audit
