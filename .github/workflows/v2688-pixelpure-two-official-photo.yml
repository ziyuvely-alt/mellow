name: Shopee v2688 two official PIXEL PURE photo-led QA upgrades
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2688-pixelpure-two-official-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests beautifulsoup4
      - name: Check exact official product pages and stage only photo-distinct images
        run: |
          cp scripts/v2688_two_pixelpure_official_gallery_upgrade.py /tmp/v2688.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2688-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2688-qa
          python /tmp/v2688.py
          git add qa-review/v2688-pixelpure-official-photo-candidate-upgrades
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'QA v2688 only exact official Pixel Pure photos if truly distinct, preserve prior four JPGs'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
