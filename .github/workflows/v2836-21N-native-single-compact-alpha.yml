name: Shopee v2836 21N 1200px native real compact foreground alpha QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2836-21N-native-single-compact-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Real one-product foreground cutout only from validated 21N 1200px native photo
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2836_clio_mini21N_native1200px_alpha.py /tmp/v2836.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2836qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2836qa
          python /tmp/v2836.py
          git add qa-review/v2836-clio-mini5g-21N-1200px-isolated-compact-alpha-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2836 candidate isolated high-native 21N compact alpha, no old image changes'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
