name: Shopee v2849 CLIO Mesh Blur stock three-shade real photo QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2849-clio-meshblur-stock-shade-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - name: Check 19C 19N and 21N exact variant merchant photographs without altering prior artwork
        run: |
          cp scripts/v2849_clio_meshblur_three_stock_shades_QA.py /tmp/v2849.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2849qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2849qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2849.py
          git add qa-review/v2849-clio-meshblur-15g-refill-three-stock-shades-sourceQA
          git commit -m 'v2849 Mesh Blur 15g+refill stock 3 shade photo QA, no customer review or sale approval'
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
