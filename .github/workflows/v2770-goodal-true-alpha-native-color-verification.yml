name: Shopee v2770 GOODAL cutout 1to1 provenance and silver-cap edge QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2770-goodal-true-alpha-native-color-verification.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Prove original RGB pixels and silver cap remained intact with native checkerboard QA
        run: |
          cp scripts/v2770_goodal_original_photo_rgb_and_silver_cap_QA.py /tmp/v2770.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2770-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2770-qa
          python /tmp/v2770.py
          git add qa-review/v2770-goodal-single-tube-native-source-alpha-validation
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2770 verify exact RGB provenance of GOODAL tube alpha and 1to1 silver cap, keep source JPGs untouched'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
