name: Shopee v2821 exact CLIO 21N mini 5g product-only real alpha
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2821-clio-21n-real-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  single-21n:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real alpha-removal dependencies
        run: python -m pip install Pillow numpy opencv-python-headless 'rembg[cpu]==2.0.67'
      - name: Process previously saved exact 21N merchant variant photo only
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          cp scripts/v2821_clio_exact_21n_product_alpha.py /tmp/v2821.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2821-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2821-qa
          python /tmp/v2821.py
          git add qa-review/v2821-clio-mini-5g-21N-true-compact-alpha-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2821 exact CLIO mini 5g 21N product-only real alpha, never relabel 23N'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
