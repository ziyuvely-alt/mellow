name: Shopee v2715 five remaining product hero AI cutouts actual stock-photo QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2715-five-fresh-stock-photo-cutouts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real foreground-segmentation dependency
        run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Segmentation on five previously untreated product groups from historic photo JPGs
        env:
          U2NET_HOME: /tmp/isnet-segmentation-models
        run: |
          python -m py_compile scripts/v2715_five_remaining_stock_alpha_cutouts.py
          cp scripts/v2715_five_remaining_stock_alpha_cutouts.py /tmp/v2715.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2715-review qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2715-review
          python /tmp/v2715.py
          git add qa-review/v2715-five-more-original-product-real-alpha-hero-tests
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2715 five additional original-source true alpha product candidates staged, previous originals immutable'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
