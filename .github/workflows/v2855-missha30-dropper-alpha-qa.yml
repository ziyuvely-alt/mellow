name: Shopee v2855 MISSHA serum 30mL preserve RGB local cap alpha repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2855-missha30-dropper-alpha-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  precise_cap_alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy
      - name: Remove tiny dropper decoration alpha, preserve source RGB and existing photos
        run: |
          cp scripts/v2855_missha_serum30_dropper_alpha_cleanup.py /tmp/v2855.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2855qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2855qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2855.py
          git add qa-review/v2855-missha30ml-dropper-residue-precision-alpha-QA
          git commit -m 'v2855 preserve serum RGB, remove red droplet halo in NEW QA alpha only'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
