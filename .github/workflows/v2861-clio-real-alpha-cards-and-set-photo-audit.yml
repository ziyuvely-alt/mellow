name: Shopee v2861 CLIO exact shades QA cards and giftset source audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2861-clio-real-alpha-cards-and-set-photo-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  three_cards_ten_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - name: Build three no-logo alpha-backed shade QA cards plus cross-family duplicate source QA
        run: |
          cp scripts/v2861_clio_meshblur_3_option_cards_and_10_variant_collision_audit.py /tmp/v2861.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2861qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2861qa
          git config user.name QA-Archive-Bot
          git config user.email qa-archive-bot@users.noreply.github.com
          python /tmp/v2861.py
          git add qa-review/v2861-clio-three-shade-option-QA-and-ten-variant-collision-audit
          git commit -m 'v2861 add 3 distinct MeshBlur shade QA cards plus 10 shade file collision audit'
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
