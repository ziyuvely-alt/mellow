name: Shopee v2710 fix 2 misleading copy labels in v2709 detail JPGs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2710-correct-two-photo-detail-captions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Make text-only corrections in exactly two QA JPGs, leave eight original files byte-identical
        run: |
          cp scripts/v2710_fix_two_photo_detail_labels.py /tmp/v2710.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2710-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2710-qa
          python /tmp/v2710.py
          git add qa-review/v2710-two-accurate-copy-corrections-photo-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2710 correct CLIO photo caption and PIXEL PURE brand copy only, preserve prior 8 JPGs'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
