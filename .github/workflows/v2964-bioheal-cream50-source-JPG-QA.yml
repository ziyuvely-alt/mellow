name: v2964 BIOHEAL BOH 50mL fifth internal source photo
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2964-bioheal-cream50-source-JPG-QA.yml'
      - 'scripts/v2964_bioheal_cream50_clean_fifth_candidate.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  single-new-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Preserve 4 old source hashes, test one new merchant photo
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2964-bioheal-cream50-open-jar-fifth-scene-internal-20261106
          python scripts/v2964_bioheal_cream50_clean_fifth_candidate.py
          git add qa-review/v2964-bioheal-cream50-open-jar-fifth-scene-internal-20261106
          git diff --cached --name-only | tee /tmp/v2964-appendonly
          ! grep -Ev '^qa-review/v2964-bioheal-cream50-open-jar-fifth-scene-internal-20261106/' /tmp/v2964-appendonly
          git commit -m "QA v2964: one additional NAD-PRIZCELL cream50 photograph only; not approved for retail"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
