name: Shopee v2485 MISSHA PDRN NAD Cream 70ml official photo source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2485-missha-pdrn-cream-sources.yml'
      - 'scripts/v2485_missha_pdrn_cream_70_official_photo.py'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Check original AbleShop 70ml cream product gallery
        run: python scripts/v2485_missha_pdrn_cream_70_official_photo.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2485-MISSHA-NAD-70ml-cream-official-photo-evidence
          path: v2485-missha-pdrn-cream-official-evidence/
          retention-days: 90
          if-no-files-found: error
