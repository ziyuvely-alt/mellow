name: Shopee v2708 pre-release QC on 80 prior original JPGs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2708-eightygenuine-jpg-quality-gates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Real 80-JPG integrity and duplicate-scene audit, no regeneration
        run: |
          cp scripts/v2708_archive_pre_release_audit.py /tmp/v2708.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2708-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2708-qa
          python /tmp/v2708.py
          git add qa-review/v2708-16-family-pre-release-80-jpg-unique-scene-audit
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2708 batch audit 80 recovered original JPGs for near duplicates, stock mismatch and unauthorized logo use'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
