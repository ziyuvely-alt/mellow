name: Shopee v2503 DrG original 2022 cream photo and facts JPG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2503-drg-2022-cream-three.yml'
      - 'scripts/v2503_drg_2022_soothing_three_photo_facts.py'
permissions:
  actions: read
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore exact original 2022 jar/carton photo from prior success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41692792277 -n shopee-v2502-drg-2022-clear-soothing-70ml-old-photo-QA -D v2502-old-source
      - run: python scripts/v2503_drg_2022_soothing_three_photo_facts.py
      - name: Check all actual JPGs exist before declaring success
        run: |
          test -s v2503-drg-old-2022-three-JPG/03-original-old-jar-carton.jpg
          test -s v2503-drg-old-2022-three-JPG/04-product-format-70ml.jpg
          test -s v2503-drg-old-2022-three-JPG/05-basic-use-guide.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2503-drg-2022-cream-three-real-JPGs-QA-HOLD
          path: v2503-drg-old-2022-three-JPG/
          retention-days: 90
          if-no-files-found: error
      - name: Save in standalone preservation branch; no public release
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2503-drg-old-2022-three-JPG /tmp/v2503-jpgs
          git worktree add --detach /tmp/v2503-wt HEAD
          cd /tmp/v2503-wt
          git switch --orphan production-assets-v2503-drg-old-2022-three
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2503-jpgs/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve 3 genuine old DrG 2022 soothing cream JPG review drafts'
          git push origin HEAD:refs/heads/production-assets-v2503-drg-old-2022-three
