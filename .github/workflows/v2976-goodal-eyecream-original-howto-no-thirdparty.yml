name: v2976 GOODAL eye cream original English how-to single QA frame
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2976-goodal-eyecream-original-howto-no-thirdparty.yml'
      - 'scripts/v2976_goodal_eyecream_howto_original_QA.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-original-text-only-JPG:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Generate original how-to QA graphic; never touch 55 public URLs or legacy JPGs
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2976-goodal-eyecream-one-original-howto-frame-no-photo-20261106
          python scripts/v2976_goodal_eyecream_howto_original_QA.py
          git add qa-review/v2976-goodal-eyecream-one-original-howto-frame-no-photo-20261106
          git diff --cached --name-only | tee /tmp/v2976-new
          ! grep -Ev '^qa-review/v2976-goodal-eyecream-one-original-howto-frame-no-photo-20261106/' /tmp/v2976-new
          git commit -m "QA v2976 original eye cream usage card frame04 only; MK/stock release hold"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
