name: Shopee v2506 DrG Green Mild 2022 three factual JPGs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2506-drg-green-mild-three.yml'
      - 'scripts/v2506_drg_green_mild_three_new_facts.py'
permissions:
  contents: write
jobs:
  create-and-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Render only missing fact frames 03-05
        run: python scripts/v2506_drg_green_mild_three_new_facts.py
      - name: Check actual bytes before declaring success
        run: |
          test -s v2506-drg-green-mild-2022-three-facts/03-mineral-sun-care-facts.jpg
          test -s v2506-drg-green-mild-2022-three-facts/04-zinc-oxide-factual-ingredient.jpg
          test -s v2506-drg-green-mild-2022-three-facts/05-sunscreen-usage-guide.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2506-drg-green-mild-three-information-JPG-QA-HOLD
          path: v2506-drg-green-mild-2022-three-facts/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve JPG draft originals in isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2506-drg-green-mild-2022-three-facts /tmp/v2506-assets
          git worktree add --detach /tmp/v2506-wt HEAD
          cd /tmp/v2506-wt
          git switch --orphan production-assets-v2506-drg-green-mild-facts
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2506-assets/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve 3 factual DrG 2022 Green Mild Sun review cards; no existing photo rewrites'
          git push origin HEAD:refs/heads/production-assets-v2506-drg-green-mild-facts
