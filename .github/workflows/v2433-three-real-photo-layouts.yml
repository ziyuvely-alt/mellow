name: Shopee v2433 three real-source product JPG partial layout revisions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2433-three-real-photo-layouts.yml'
      - 'scripts/v2433_three_source_photo_white_layouts.py'
permissions:
  contents: write
jobs:
  three-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Recover exact preserved source JPGs
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Make real product-photo white-layout JPEG candidates
        run: python scripts/v2433_three_source_photo_white_layouts.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2433-three-real-product-photo-drafts
          path: v2433-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve result only on new branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2433-output /tmp/v2433-saved
          git worktree add --detach /tmp/v2433-wt HEAD
          cd /tmp/v2433-wt
          git switch --orphan production-assets-v2433-three-photo-layouts
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2433-saved/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve three real-photo partial layout drafts without publication'
          git push origin HEAD:refs/heads/production-assets-v2433-three-photo-layouts
