name: Shopee v2441b two additional distinct factual JPG corrections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2441b-second-frame-fixes.yml'
      - 'scripts/v2441b_second_frame_fixes.py'
permissions:
  contents: write
jobs:
  two-extra-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Restore historical source JPEG only
        run: |
          mkdir baseline-v2427b
          git fetch origin production-assets-v2427b-obge-shade-clean
          git archive origin/production-assets-v2427b-obge-shade-clean | tar -xf - -C baseline-v2427b
      - name: Produce two distinct real customer JPG corrections
        run: python scripts/v2441b_second_frame_fixes.py
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-v2441b-two-distinct-real-JPGs
          path: v2441b-output/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve independent branch without public asset writes
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2441b-output /tmp/v2441b-save
          git worktree add --detach /tmp/v2441b-wt HEAD
          cd /tmp/v2441b-wt
          git switch --orphan production-assets-v2441b-two-extra-fixes
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v2441b-save/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Store second-frame Goodal and MISSHA genuine copy corrections under rights hold'
          git push origin HEAD:refs/heads/production-assets-v2441b-two-extra-fixes
