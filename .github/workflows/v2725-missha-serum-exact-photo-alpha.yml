name: Shopee v2725 MISSHA exact 30mL serum photo genuine alpha QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2725-missha-serum-exact-photo-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow 'rembg[cpu]==2.0.67'
      - name: Use only existing exact-product saved original04, no info card
        env:
          U2NET_HOME: /tmp/isnet-model-weights
        run: |
          python -m py_compile scripts/v2725_missha_single_serum_alpha.py
          cp scripts/v2725_missha_single_serum_alpha.py /tmp/v2725.py
          git fetch origin qa-assets/v2662-immutable-14-candidates
          git worktree add /tmp/v2725-qa qa-assets/v2662-immutable-14-candidates
          cd /tmp/v2725-qa
          test ! -e qa-review/v2725-missha-serum-30ml-true-single-bottle-cutout-QA
          python /tmp/v2725.py
          git add qa-review/v2725-missha-serum-30ml-true-single-bottle-cutout-QA
          git -c user.name=QA-Archive-Bot -c user.email=qa-archive-bot@users.noreply.github.com commit -m 'v2725 exact photo04 MISSHA serum 30ml neural cutout QA no retail publishing'
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
