name: v2960 PIXELPURE 200mL Toner alternative original photo
on:
  push:
    branches: ['qa-assets/v2662-immutable-14-candidates']
    paths:
      - '.github/workflows/v2960-pixelpure-200ml-toner-new-source.yml'
      - 'scripts/v2960_pixelpure_toner200_multibottle_candidate.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  single-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Test distinct source, stop on small image, never public release
        run: |
          set -euo pipefail
          git config user.name "QA-Archive-Bot"
          git config user.email "qa-archive-bot@users.noreply.github.com"
          test ! -e qa-review/v2960-pixelpure-toner200-distinct-multibottle-scene-20261106
          python scripts/v2960_pixelpure_toner200_multibottle_candidate.py
          git add qa-review/v2960-pixelpure-toner200-distinct-multibottle-scene-20261106
          git diff --cached --name-only | tee /tmp/v2960-changed
          ! grep -Ev '^qa-review/v2960-pixelpure-toner200-distinct-multibottle-scene-20261106/' /tmp/v2960-changed
          git commit -m "QA v2960: test distinct Pixelpure 200mL toner native photo without public sales approval"
          git pull --rebase origin qa-assets/v2662-immutable-14-candidates
          git push origin HEAD:refs/heads/qa-assets/v2662-immutable-14-candidates
